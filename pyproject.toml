[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "/tmp/ruff-cache"
exclude = ["build", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [
  "shared/common/python/contracts/src",
  "shared/common/python/run_logging/src",
  "shared/common/python/trajectory/src",
  "simulation/mujoco/src",
  "hardware/tianji/src",
  "runtime/ros2/ros/dual_arm_runtime",
  "learning/lerobot/src",
  "tests/fakes/policy",
]
