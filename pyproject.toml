[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".build/ruff-cache"
exclude = [".build", "var", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [
  "contracts/python/src",
  "libraries/backend_core/src",
  "libraries/run_logging/src",
  "simulation/mujoco/src",
  "runtime/ros2/ros/dual_arm_runtime",
  "learning/lerobot/src",
  "tests/doubles/policy",
]
