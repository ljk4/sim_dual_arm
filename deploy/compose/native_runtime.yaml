# Overlay for the diagnostic native runtime.  Merge with native_backend.yaml so
# both services share the same Compose project, ROS_DOMAIN_ID and private
# network.  Source/SDK/config/assets are read-only; only the data root is
# writable.  This file deliberately does not duplicate the backend lifecycle.
name: ${NATIVE_PROJECT:-sim-dual-arm-native}

services:
  native-runtime:
    image: ${NATIVE_RUNTIME_IMAGE:-sim-dual-arm/dev-ros:stage2}
    user: "${NATIVE_UID:-1000}:${NATIVE_GID:-1000}"
    working_dir: /workspace
    environment:
      DEV_REPO_ROOT: /workspace
      DEV_ROS_ROOT: /opt/ros-dev
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_LOCALHOST_ONLY: "0"
      ROS_LOG_DIR: /tmp/ros-logs
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/fastdds.xml
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      NATIVE_EPISODE_ID: "${NATIVE_EPISODE_ID:-}"
      NATIVE_RUN_ID: "${NATIVE_RUN_ID:?run id is required}"
      NATIVE_DATA_ROOT: "${NATIVE_DATA_ROOT:?writable data root is required}"
      NATIVE_RUNTIME_CONFIG_CONTAINER: "${NATIVE_RUNTIME_CONFIG_CONTAINER:-/workspace/configs/runtime/native_collect.yaml}"
    volumes:
      - type: bind
        source: ${NATIVE_REPO_ROOT:?repository root is required}
        target: /workspace
        read_only: true
      - type: bind
        source: ${NATIVE_BUILD_ROOT:?generated ROS workspace is required}
        target: /opt/ros-dev
        read_only: true
      - type: bind
        source: ${NATIVE_ASSETS_ROOT:?pinned asset checkout is required}
        target: /sim-assets
        read_only: true
      - type: bind
        source: ${NATIVE_ASSET_SUMMARY:?asset summary is required}
        target: /sim-assets-summary/panda.json
        read_only: true
      - type: bind
        source: ${NATIVE_DATA_ROOT}
        target: /data
    command:
      - python3
      - -m
      - dual_arm_runtime.native_node
      - --project-root
      - /workspace
      - --config
      - "${NATIVE_RUNTIME_CONFIG_CONTAINER:-/workspace/configs/runtime/native_collect.yaml}"
      - --output
      - "/data/raw/${NATIVE_RUN_ID}"
      - --run-id
      - "${NATIVE_RUN_ID}"
      - --runs-output
      - /data/runs
      - --shutdown-timeout
      - "20"
      - --once
    depends_on:
      native-backend:
        condition: service_started
    networks: [native]
    stop_grace_period: 30s
    restart: "no"

networks:
  native: {}
