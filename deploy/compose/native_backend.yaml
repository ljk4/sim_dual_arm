# Runnable native MuJoCo/ROS backend.  Source, generated SDK, assets, summary
# and the backend config are read-only; only the run root is writable.  This
# service uses the existing backend-sim:mujoco-dev image and dev_ros entrypoint
# (sourced SDK + mounted source), an isolated project network and UDP-only
# Fast DDS.  It never uses host networking.
name: ${NATIVE_PROJECT:-sim-dual-arm-native}

services:
  native-backend:
    image: ${NATIVE_IMAGE:-sim-dual-arm/backend-sim:mujoco-dev}
    user: "${NATIVE_UID:-1000}:${NATIVE_GID:-1000}"
    working_dir: /workspace
    runtime: nvidia
    gpus: all
    environment:
      DEV_REPO_ROOT: /workspace
      DEV_ROS_ROOT: /opt/ros-dev
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_LOCALHOST_ONLY: "0"
      ROS_LOG_DIR: /tmp/ros-logs
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/fastdds.xml
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      NATIVE_RUN_ID: "${NATIVE_RUN_ID:?run id is required; use tools/run/native_backend.py}"
    volumes:
      - type: bind
        source: ${NATIVE_REPO_ROOT:?repository root is required}
        target: /workspace
        read_only: true
      - type: bind
        source: ${NATIVE_BUILD_ROOT:?generated ROS workspace is required}
        target: /opt/ros-dev
        read_only: true
      - type: bind
        source: ${NATIVE_ASSETS_ROOT:?pinned asset checkout is required}
        target: /sim-assets
        read_only: true
      - type: bind
        source: ${NATIVE_ASSET_SUMMARY:?asset summary is required}
        target: /sim-assets-summary/panda.json
        read_only: true
      - type: bind
        source: ${NATIVE_RUN_ROOT:?run root is required}
        target: /sim-runs
    command:
      - bash
      - -c
      - |
        set -eo pipefail
        export PYTHONPATH="/workspace/components/backend_sim/src:$${PYTHONPATH}"
        exec python3 -m robot_backend_sim.node \
          --config "${NATIVE_CONFIG_CONTAINER:?config path is required}" \
          --assets-root /sim-assets \
          --asset-summary /sim-assets-summary/panda.json \
          --run-root /sim-runs \
          --run-id "${NATIVE_RUN_ID}"
    networks: [native]
    stop_grace_period: 20s
    restart: "no"

networks:
  native: {}
