name: ${DEV_COMPOSE_PROJECT:-sim-dual-arm-dev}

# One dependency image is shared by the source-mounted backend and runtime.
# Only the one-shot builder profile can write the generated ROS workspace.
x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  ROS_LOCALHOST_ONLY: "0"
  PYTHONUNBUFFERED: "1"
  DEV_REPO_ROOT: /workspace
  DEV_ROS_ROOT: /opt/ros-dev
  DEV_IMAGE: ${DEV_IMAGE:-sim-dual-arm/dev-ros:stage2}
  DEV_WORKSPACE_VERSION: ${DEV_WORKSPACE_VERSION:-unknown}
  ROS_LOG_DIR: /tmp/ros-dev-logs

services:
  backend:
    image: ${DEV_IMAGE:-sim-dual-arm/dev-ros:stage2}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment: *ros-environment
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DEV_REPO_ROOT:-.}
        target: /workspace
        read_only: true
      - type: bind
        source: ${DEV_BUILD_ROOT:-.build/ros-dev}
        target: /opt/ros-dev
        read_only: true
    command:
      - python
      - -m
      - mock_robot_backend.node
      - --profile
      - /workspace/profiles/robots/mock_dual_arm_v1/profile.json
      - --schemas
      - /workspace/contracts/schemas/v1
      - --namespace
      - /cell_01/robot
    networks: [robot]
    stop_grace_period: 10s

  runtime:
    image: ${DEV_IMAGE:-sim-dual-arm/dev-ros:stage2}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment: *ros-environment
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DEV_REPO_ROOT:-.}
        target: /workspace
        read_only: true
      - type: bind
        source: ${DEV_BUILD_ROOT:-.build/ros-dev}
        target: /opt/ros-dev
        read_only: true
      - type: bind
        source: ${DEV_RAW_ROOT:-var/data/raw}
        target: /data/raw
      - type: bind
        source: ${DEV_RUNS_ROOT:-var/runs}
        target: /data/runs
    command:
      - python
      - -m
      - dual_arm_runtime.node
      - --project-root
      - /workspace
      - --config
      - /workspace/configs/runtime/mock_collect.yaml
      - --output
      - "/data/raw/${DEV_RUN_ID:?run id is required; use tools/run/dev_compose.py --run-id}"
      - --run-id
      - "${DEV_RUN_ID:?run id is required; use tools/run/dev_compose.py --run-id}"
      - --runs-output
      - /data/runs
      - --shutdown-timeout
      - "15"
    depends_on:
      backend:
        condition: service_started
    networks: [robot]
    # Longer than the runtime worker (15 s), logging and recording close budgets.
    stop_grace_period: 30s

  builder:
    profiles: ["build"]
    image: ${DEV_IMAGE:-sim-dual-arm/dev-ros:stage2}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      <<: *ros-environment
      DEV_ROS_BUILD: "1"
      COLCON_HOME: /opt/ros-dev/colcon-home
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DEV_REPO_ROOT:-.}
        target: /workspace
        read_only: true
      - type: bind
        source: ${DEV_BUILD_ROOT:-.build/ros-dev}
        target: /opt/ros-dev
    command:
      - python
      - /workspace/tools/build/dev_workspace.py
      - build
      - --project-root
      - /workspace
      - --build-root
      - /opt/ros-dev

networks:
  robot: {}
