# Overlay for the independent ACT Policy service.
#
# Merge only native_backend.yaml + native_runtime.yaml + this file.  It never
# starts fake-policy and never falls back to a test provider.  The 035 system
# layer, host venv, pinned LeRobot source, Policy SDK, weight/cache root and the
# trained bundle are read-only; only the attempt data root is writable.
name: ${NATIVE_PROJECT:-sim-dual-arm-native}

services:
  act-policy:
    image: ${NATIVE_ACT_IMAGE:-sim-dual-arm/learning:act-dev}
    user: "${NATIVE_UID:-1000}:${NATIVE_GID:-1000}"
    working_dir: /workspace
    runtime: nvidia
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/policy-sdk:/workspace/components/learning/src:/workspace/libraries/run_logging/src:/opt/lerobot/src
      LEARNING_SOURCE: /opt/lerobot/src
      # Weight cache stays read-only; mutable Python/HF caches live under /data.
      LEARNING_CACHE_ROOT: /data/act-cache
      HF_HOME: /data/act-cache/hf
      HF_DATASETS_CACHE: /data/act-cache/hf/datasets
      TRANSFORMERS_CACHE: /data/act-cache/hf/transformers
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ACT_POLICY_CONFIG: "${NATIVE_ACT_POLICY_CONFIG_CONTAINER:-/workspace/configs/learning/act_policy.yaml}"
      ACT_BUNDLE_CONTAINER: "${NATIVE_ACT_BUNDLE_CONTAINER:-/opt/act-bundle}"
      ACT_LOG_DIRECTORY: /data/act-policy-log
    volumes:
      - type: bind
        source: ${NATIVE_REPO_ROOT:?repository root is required}
        target: /workspace
        read_only: true
      - type: bind
        source: ${NATIVE_POLICY_SDK_ROOT:?generated Policy SDK is required}
        target: /opt/policy-sdk
        read_only: true
      - type: bind
        source: ${NATIVE_ACT_BUNDLE:?trained ACT bundle is required}
        target: /opt/act-bundle
        read_only: true
      - type: bind
        source: ${NATIVE_LEARNING_VENV:?verified learning venv is required}
        target: /opt/host-learning-venv
        read_only: true
      - type: bind
        source: ${NATIVE_LEARNING_SOURCE:?pinned LeRobot source is required}
        target: /opt/lerobot
        read_only: true
      - type: bind
        source: ${NATIVE_LEARNING_CACHE:?read-only weight cache is required}
        target: /opt/learning-cache
        read_only: true
      - type: bind
        source: ${NATIVE_DATA_ROOT:?writable data root is required}
        target: /data
    command:
      - python
      - -m
      - dual_arm_learning.act_service
      - --config
      - "${NATIVE_ACT_POLICY_CONFIG_CONTAINER:-/workspace/configs/learning/act_policy.yaml}"
      - --bundle
      - "${NATIVE_ACT_BUNDLE_CONTAINER:-/opt/act-bundle}"
      - --log-directory
      - /data/act-policy-log
      - --run-id
      - "${NATIVE_RUN_ID}"
    # The port opens only after the bundle is verified and the warm-up chunk has
    # been produced.  The runtime waits for this health state instead of racing.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 50051), 1); s.close()",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    networks: [native]
    stop_grace_period: 10s
    restart: "no"

  native-runtime:
    volumes:
      - type: bind
        source: ${NATIVE_POLICY_SDK_ROOT:?generated Policy SDK is required}
        target: /opt/policy-sdk
        read_only: true
    environment:
      PYTHONPATH: /opt/policy-sdk:/workspace/components/learning/src
    depends_on:
      native-backend:
        condition: service_started
      act-policy:
        condition: service_healthy

networks:
  native: {}
