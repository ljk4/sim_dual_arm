# Overlay for one automatic collection.  Only the runtime command changes so
# the base file keeps ownership of image, environment, network and mounts.
services:
  runtime:
    command:
      - python
      - -m
      - dual_arm_runtime.node
      - --project-root
      - /workspace
      - --config
      - /workspace/configs/runtime/mock_collect.yaml
      - --output
      - "/data/raw/${DEV_RUN_ID:?run id is required; use tools/run/collect_run.py}"
      - --run-id
      - "${DEV_RUN_ID:?run id is required; use tools/run/collect_run.py}"
      - --runs-output
      - /data/runs
      - --shutdown-timeout
      - "15"
      - --once
