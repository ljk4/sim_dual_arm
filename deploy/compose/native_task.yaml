# Teacher task overlay: the existing backend/runtime services, without a policy server.
services:
  native-runtime:
    environment:
      PYTHONPATH: /opt/policy-sdk:/workspace/components/learning/src
    volumes:
      - type: bind
        source: ${NATIVE_POLICY_SDK_ROOT:?generated Policy SDK is required}
        target: /opt/policy-sdk
        read_only: true
