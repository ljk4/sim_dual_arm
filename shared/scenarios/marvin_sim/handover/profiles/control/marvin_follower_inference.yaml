# Marvin Policy reference-fidelity budgets, in rad for arm joints and m for
# total gripper openings.  These bound the difference between the bounded
# reference and the requested piecewise-linear targets.  Joint hard limits,
# velocity/acceleration bounds and braking feasibility are enforced separately.
# Teacher collection uses marvin_follower.yaml.
joint_names:
  - left_joint1
  - left_joint2
  - left_joint3
  - left_joint4
  - left_joint5
  - left_joint6
  - left_joint7
  - left_gripper_width
  - right_joint1
  - right_joint2
  - right_joint3
  - right_joint4
  - right_joint5
  - right_joint6
  - right_joint7
  - right_gripper_width

# Twenty selected predictions per window (1.0 s at 50 ms per point).
target_count: 20

# Per-axis fidelity limits in the joint_names order above.
max_target_deviations:
  [0.50, 1.30, 0.52, 0.98, 0.80, 0.50, 1.51, 0.02,
   0.50, 1.30, 0.52, 0.98, 0.80, 0.50, 1.51, 0.02]

# A final reference may extend past the selected window to reach the target at
# zero velocity, but never beyond three seconds in total.
max_terminal_tail_duration_s: 3.0
