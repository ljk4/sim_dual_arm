# Marvin 交接正式采集种子与路径。
#
# pilot 与 formal 使用本方案独立种子与台账，严格隔离在 marvin_sim/handover 数据根下。

diagnostic: false

budget:
  pilot_seed_first: 3100
  formal_seed_first: 4100
  min_free_bytes: 5368709120

paths:
  attempts_root: var/marvin_sim/handover/datasets/raw
  ledger: var/marvin_sim/handover/logs/collection/attempts.jsonl
  lock: var/marvin_sim/handover/logs/collection/.ledger.lock
  run_lock: var/marvin_sim/handover/logs/collection/.run.lock
  formal_select: var/marvin_sim/handover/datasets/raw/formal-select.json
  required_paths:
    - shared/scenarios/marvin_sim/handover/configs/runtime/teacher_collect.yaml
    - shared/scenarios/marvin_sim/handover/configs/simulation/backend/backend_marvin_teacher.yaml
    - shared/scenarios/marvin_sim/handover/configs/simulation/scene/marvin_handover.yaml
    - shared/scenarios/marvin_sim/handover/configs/simulation/scene/marvin_handover_task.yaml
    - shared/scenarios/marvin_sim/extensions/ros/marvin_teacher_api_msgs/srv/GetTeacherChunk.srv
    - shared/scenarios/marvin_sim/extensions/ros/marvin_teacher_api_msgs/msg/TeacherCapability.msg
    - shared/scenarios/marvin_sim/handover/profiles/robot/profile.json
    - shared/scenarios/marvin_sim/profiles/observations/marvin_rgb_joint.json
    - shared/scenarios/marvin_sim/profiles/actions/marvin_joint_position.json
    - shared/scenarios/marvin_sim/profiles/control/marvin_control.yaml
    - shared/scenarios/marvin_sim/profiles/control/marvin_follower.yaml
    - runtime/ros2/docker/docker-compose.yml
  sdk_marker: build/ros-dev/contracts.json

launch:
  timeout_s: 600.0
  # runtime closes control, recording and the log inside this bound.
  stop_grace_s: 45.0

quality:
  # Segmentation objects come from the handover task plugin: block, table and
  # the real box bottom.  Intervals are the accepted teacher-chunk phases of
  # this scenario; a missing required phase fails the export.
  sidecar: export/quality.json
  max_blackout_s: 0.35
  min_qualified_ratio: 0.85
  phases: &all_handover_phases
    [left_approach, left_grasp, left_lift, handover_approach, dual_hold,
     left_release, left_retreat, right_transport, right_place, right_release,
     stable]
  # Left close, right catch, left release and right release must each have a
  # time-correlated observation; absent evidence is a failed export.
  required_phases: [left_grasp, dual_hold, left_release, right_release]
  # Pixel floors and tolerances were set from the first pilot's real
  # segmentation counts (per-rule minimum, ratio and longest blackout are kept
  # in its quality.json).  Required phases measured ratio 1.0 with block
  # minima of 284 (global), 1260 (left wrist) and 1682 (right wrist); the
  # floors below keep a large margin.  The left wrist only enters the view
  # during left_approach and the right wrist only during the second half of
  # handover_approach, so those intervals are recorded, not gated.
  rules:
    # Left grasp: global context plus the left wrist view of the block.
    - camera: global
      object: block
      phases: *all_handover_phases
      mode: required
      min_pixels: 128
    - camera: left_wrist
      object: block
      phases: [left_grasp, left_lift, handover_approach, dual_hold, left_release, left_retreat]
      mode: required
      min_pixels: 256
    - camera: left_wrist
      object: block
      phases: [left_approach, right_transport, right_place, right_release, stable]
      mode: record_only
      min_pixels: 16
    # Airborne handover: both wrist views hold the block once the right wrist
    # has reached the grasp region.
    - camera: right_wrist
      object: block
      phases: [dual_hold, left_release, left_retreat, right_transport, right_place, right_release, stable]
      mode: required
      min_pixels: 256
    - camera: right_wrist
      object: block
      phases: [handover_approach]
      mode: record_only
      min_pixels: 64
    # Right transport and place: the box opening stays visible.
    - camera: global
      object: box
      phases: [right_transport, right_place, right_release, stable]
      mode: required
      min_pixels: 128
    - camera: right_wrist
      object: box
      phases: [right_place, right_release, stable]
      mode: record_only
      min_pixels: 256
    # The table is context, not a per-phase requirement for the left wrist.
    - camera: global
      object: table
      phases: *all_handover_phases
      mode: record_only
      min_pixels: 4096

export:
  # 57.8 s of exact captures at 20 Hz (1155 states); bounded with margin.
  max_labels: 1400
