# Marvin 交接 Policy 执行与录制；模型身份由 Policy Service 握手提供。
# inference 评价预算：180 s 仿真任务、1 s 停止余量、420 s 墙钟。
schema_version: 1
robot_profile: ../../profiles/robots/marvin_handover_v1/profile.json
observation_schema: ../../profiles/observations/marvin_rgb_joint_v1.json
action_schema: ../../profiles/actions/marvin_joint_position_v1.json
control_constraints: ../../profiles/control/marvin_control_v1.yaml
follower_config: ../../profiles/control/marvin_follower_inference_v1.yaml
robot_namespace: /robot

action_source: policy

lease_duration_ns: 2000000000
renew_interval_ns: 500000000
command_acceptance_ns: 500000000
startup_timeout_s: 30.0
call_timeout_s: 5.0
command_timeout_s: 8.0

reset:
  enabled: true
  seed: 0

observation:
  reliable: true
  # max_skew_ns / max_age_ns come from the observation profile.
  wall_arrival_timeout_s: 1.5
  capacity: 32

control:
  submit_query_retries: 2
  poll_interval_s: 0.02
  stop_timeout_s: 8.0
  terminal_timeout_s: 20.0

policy:
  # The runtime learns model/processor digests from GetPolicyInfo; it never
  # reads a bundle or model file.
  endpoint: learning:50051
  allow_test_policy: false
  expected_test_only: false
  task_id: marvin-handover
  task_text: >-
    Pick up the block with the left arm, hand it to the right arm, and place it
    into the box.
  chunk_size: 60
  action_period_ns: 50000000
  # A 20-point window is 1.0 s at the fixed 50 ms period.  The provider still
  # returns a complete 60-point chunk; the interface remains 60x16.
  startup_settle_sim_ns: 2000000000
  initial_lead_ns: 250000000
  # 256 windows x 20 points x 50 ms cover 256 s, above the 180 s task budget.
  max_chunks: 256
  total_sim_deadline_ns: 180000000000
  # 180 s of task simulation at half real-time, plus settle, RPC and bounded stop.
  total_wall_deadline_s: 420.0
  connect_timeout_s: 2.0
  open_deadline_s: 2.0
  predict_deadline_s: 2.0
  close_deadline_s: 2.0
  max_message_bytes: 16777216
  poll_interval_s: 0.02
  termination_mode: task
  task_stop_margin_s: 1.0
  task_sim_budget_ns: 180000000000

motions: []

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
recording:
  queue_capacity: 1024
  max_pending_bytes: 67108864
  startup_timeout_s: 5.0
  close_timeout_s: 5.0
