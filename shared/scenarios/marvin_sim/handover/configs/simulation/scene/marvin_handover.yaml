# Fixed-base Marvin handover baseline (P01A).
#
# Robot assembly and task environment are selected independently.  The
# simulation resolves the robot model from its own assets/ root using
# robot.assembly; numeric robot geometry, mass and joint limits are read from
# the source URDF.  The values here are executable ranges, reset pose and
# verified servo gains.
physics:
  timestep: 0.002
  gravity: [0.0, 0.0, -9.81]
  integrator: implicitfast
  # Separate tangential impedance from normal compliance for grasp contacts.
  cone: elliptic
  impratio: 10.0
  noslip_iterations: 3
  # A finite finger contact patch supports torque about the closing axis.
  # The torsional coefficient is a length (20 mm), not a sliding coefficient.
  object_contact_dim: 4
  object_friction: [1.0, 0.02, 0.0001]

robot:
  # The simulation resolves the model from its assets directory.
  assembly: marvin
  base_position: [0.0, 0.0, 0.0]
  base_yaw_deg: 0.0
  # Symmetric 3D forward-embracing rest pose (right mirrors left across XZ plane).
  home_joint_positions:
    left: [0.5, -0.8, 0.6, -1.45, 0.45, -0.25, -0.15]
    right: [-0.5, -0.8, -0.6, -1.45, 0.45, 0.25, 0.15]
  # Position servos model a robot controller that compensates its own weight.
  # The free task object retains gravity and is supported only by contact.
  gravity_compensation: true
  # Measured inner finger-face distance at zero and full tendon closure.
  gripper_open_total: 0.0814
  gripper_closed_total: 0.0014
  arm_kp: [2500.0, 2500.0, 1500.0, 1500.0, 400.0, 400.0, 400.0]
  arm_kv: [150.0, 150.0, 90.0, 90.0, 30.0, 30.0, 30.0]
  joint_damping: 1.0
  joint_armature: 0.01
  gripper_kp: 2000.0
  gripper_kv: 50.0
  gripper_force: 200.0
  # Viscous slide damping suppresses mimic/contact micro-oscillation at 2 ms.
  finger_damping: 200.0

task:
  environment: handover
  # Task geometry is expressed in the robot base frame and transformed by the
  # declared base pose during assembly.
  frame: robot_base
  table:
    center_xy: [0.70, 0.0]
    size_xy: [0.60, 1.00]
    top_z: 0.78
    thickness: 0.05
    rgba: [0.55, 0.45, 0.32, 1.0]
  block:
    name: block
    half_extents: [0.03, 0.10, 0.03]
    initial_xy: [0.55, 0.12]
    initial_yaw_deg: 0.0
    mass: 0.30
    rgba: [0.80, 0.20, 0.18, 1.0]
  box:
    name: box
    # P02B measurement: the deep 0.22 m box at (0.66, -0.27) made the right
    # wrist/finger penetrate a wall during the place descent.  This 0.32 m
    # square, 0.10 m high box keeps the same inner bottom and supports at
    # least 7 mm robot clearance on the measured place path.
    center_xy: [0.64, -0.27]
    outer_xy: [0.32, 0.32]
    height: 0.10
    bottom_thickness: 0.012
    wall_thickness: 0.012
    yaw_deg: 0.0
    rgba: [0.18, 0.38, 0.82, 1.0]
  camera_mount:
    position: [0.15, 0.0, 1.90]

cameras:
  # Camera looks along its local -Z axis with local +Y up.  All poses are
  # fixed local extrinsics; nothing tracks an object or the robot.
  global:
    parent: camera_mount
    position: [0.0, 0.0, 0.0]
    # Look-at (0.55, 0.0, 0.80) from the mount above, world +Z up.
    quaternion_wxyz: [0.6963823345491392, 0.12268514224587566, -0.12268514224587566, -0.6963823345491392]
    fovy: 60.0
    width: 320
    height: 240
  left_wrist:
    parent: Arm_L9_Link
    # Behind and above the palm, looking along the fingers; image up follows
    # the hand X axis so the block length reads across the frame.
    position: [0.0, 0.06, 0.09]
    quaternion_wxyz: [-0.5, 0.5, 0.5, 0.5]
    fovy: 85.0
    width: 320
    height: 240
  right_wrist:
    parent: Arm_R9_Link
    position: [0.0, 0.06, 0.09]
    quaternion_wxyz: [-0.5, 0.5, 0.5, 0.5]
    fovy: 85.0
    width: 320
    height: 240
