# Marvin 标准 Robot API 后端；本阶段不加载任何任务插件。
# Direct simulation --config 使用本文件；robot.task 与 robot.task_mode
# 同时省略。任务插件、Teacher 和交接评价由后端 Teacher/Policy 配方接入。
robot:
  namespace: /robot
  profile: ../../../profiles/robot/profile.json
  schemas: ../../../../../../common/interfaces/schemas
  scene: ../scene/marvin_handover.yaml
  control: ../../../../profiles/control/marvin_control.yaml
  stream: ../../../profiles/control/marvin_stream.yaml
  follower: ../../../../profiles/control/marvin_follower.yaml
  # Affine PD reference-velocity feedforward; hard limits unchanged.
  velocity_feedforward: true
  reliable_sensors: true

run:
  seed: 0
  capture_hz: 20.0
  realtime_speed: 1.0
  max_catchup_steps: 8

queues:
  owner: 64
  planner: 4
  render_snapshots: 4
  render_outputs: 8
  captures: 32
  events: 1024
  feedback: 64
  accepted_references: 256
  follower_references: 256

limits:
  planner_health_s: 10.0
  renderer_health_s: 5.0
  request_timeout_s: 5.0
  shutdown_s: 10.0
  command_history: 256
  chunk_history: 512

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
