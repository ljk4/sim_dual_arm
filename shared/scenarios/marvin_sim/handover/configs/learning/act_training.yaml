# Marvin 交接正式训练：显式 --mode full 时训练 5000 步。
# 模型结构与 ACT 适配保持一致；batch/worker 按本机 6 GiB GPU 实测设置。
schema_version: 1
mode: smoke
seed: 20261113
device: cuda
cache_root: var/marvin_sim/handover/datasets/.cache
data:
  config: shared/scenarios/marvin_sim/handover/configs/learning/act_dataset.yaml
  root: var/marvin_sim/handover/datasets/lerobot
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
  # full 模式按此规则在内存中抽稀静止冗余锚点；smoke/overfit 不启用。
  sample_filter: shared/scenarios/marvin_sim/handover/configs/learning/act_sample_filter.yaml
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  # None is intentional: the local official file is loaded explicitly and
  # strictly, so model construction can never trigger an implicit download.
  pretrained_backbone_weights: null
  weights:
    path: third_party/weights/resnet18-f37072fd.pth
training:
  batch_size: 40
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  amp_dtype: bfloat16
  lr: 0.0001
  lr_backbone: 0.00001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  val_every_steps: 1000
  val_batches: 512
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    # Use every qualified training episode; no static sample filter is applied.
    episodes: all
    validation: false
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
  full:
    steps: 5000
    split: train
    episodes: all
    validation: true
checkpoint:
  root: var/marvin_sim/handover/models
logging:
  root: var/marvin_sim/handover/logs/training
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
