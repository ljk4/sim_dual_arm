# Marvin stack ACT policy inference service configuration.
schema_version: 1

model:
  robot_profile_path: ../../profiles/robots/marvin_stack_v1/profile.json
  observation_schema_path: ../../profiles/observations/marvin_rgb_joint_v1.json
  action_schema_path: ../../profiles/actions/marvin_joint_position_v1.json
  device: cuda
  require_formal: true
  max_prediction_corrections:
    left_gripper_width: 0.005
    right_gripper_width: 0.005
  temporal_ensemble_coeff: null

service:
  bind_address: 0.0.0.0
  port: 50051
  max_workers: 4
  max_message_bytes: 16777216
  max_sessions: 8
  max_open_requests: 128
  max_request_cache: 128
  predict_deadline_s: 3.0
  open_deadline_s: 5.0
  close_deadline_s: 5.0
  test_only: false
  protocol_major: 1
  stateful: true
  task_id: marvin-stack
  task_text: >-
    Pick up the red source cube with the right arm and stack it onto the blue
    target cube.

logging:
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
