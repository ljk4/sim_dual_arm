# Marvin stack formal LeRobot dataset conversion.
fps: 20
chunk_size: 60
# 动作标签对齐观测后一个采样周期（50 ms）。
action_lead_ns: 50000000
state_dim: 16
camera_names: [global, left_wrist, right_wrist]
camera_width: 320
camera_height: 240
task_text: >-
  Pick up the red source cube with the right arm and stack it onto the blue
  target cube.
profile: shared/scenarios/marvin_sim/stack/profiles/robot/profile.json
select: var/marvin_sim/stack/datasets/raw/formal-select.json
output_root: var/marvin_sim/stack/datasets/lerobot
cache_root: var/marvin_sim/stack/debug/learning-cache
# 相对单局采集目录的导出路径，Runtime 写入 <attempt>/export。
attempt_export_glob: "export"
verify_png_pixels: true
require_quality: true
validation_percent: 10
expected:
  formal_episodes: 50
lerobot:
  source_revision: 7e241bd630a3719a56157a497ce5d08f244784f1
  rgb_encoder:
    vcodec: h264
    g: 2
    crf: 18
    preset: veryfast
  video_backend: pyav
  encoder_threads: 4
  image_writer_threads: 4
