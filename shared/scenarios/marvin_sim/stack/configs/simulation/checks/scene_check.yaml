# Static three-camera visibility check for the nominal Marvin stack layout.

min_visible_pixels:
  global:
    source: 32
    target: 64
  left_wrist:
    source: 8
    target: 16
  right_wrist:
    source: 32
    target: 64

throughput:
  warmup_groups: 3
  measure_groups: 20
  max_elapsed_s: 60.0
  min_fps: 20.0
