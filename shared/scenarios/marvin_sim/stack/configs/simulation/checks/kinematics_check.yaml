# Key-pose IK, clearance and per-phase visibility check parameters for Marvin stack.

ik:
  dt_s: 0.02
  max_iterations: 1200
  position_tolerance_m: 0.001
  orientation_tolerance_rad: 0.005
  posture_cost: 0.01
  position_cost: 10.0
  orientation_cost: 10.0
  lm_damping: 0.1
  limit_margin_rad: 0.05
  solver: daqp
  initial_right_joint_positions: [0.74, -1.815, 1.778, -1.264, 0.635, -0.413, -0.88]

clearance:
  minimum_clearance_m: 0.003
  collision_detection_distance_m: 0.03
  sample_step_rad: 0.02
  max_samples_per_segment: 1000

targets:
  pregrasp_height_m: 0.09
  grasp_height_m: 0.032
  lift_height_m: 0.14
  place_hover_height_m: 0.11
  place_clearance_m: 0.006
  retreat_height_m: 0.15
  approach_tilt_deg: 20.0
  approach_yaw_deg: -90.0
  place_yaw_deg: -90.0

visibility:
  rules:
    - {camera: global, object: source, phase: pregrasp, mode: min_pixels, min_pixels: 32}
    - {camera: global, object: source, phase: grasp, mode: min_pixels, min_pixels: 32}
    - {camera: global, object: source, phase: lift, mode: min_pixels, min_pixels: 32}
    - {camera: global, object: source, phase: place_hover, mode: min_pixels, min_pixels: 32}
    - {camera: global, object: source, phase: place, mode: min_pixels, min_pixels: 32}
    - {camera: global, object: source, phase: retreat, mode: min_pixels, min_pixels: 32}
    - {camera: global, object: target, phase: pregrasp, mode: min_pixels, min_pixels: 64}
    - {camera: global, object: target, phase: grasp, mode: min_pixels, min_pixels: 64}
    - {camera: global, object: target, phase: lift, mode: min_pixels, min_pixels: 64}
    - {camera: global, object: target, phase: place_hover, mode: min_pixels, min_pixels: 64}
    - {camera: global, object: target, phase: place, mode: min_pixels, min_pixels: 64}
    - {camera: global, object: target, phase: retreat, mode: min_pixels, min_pixels: 64}
    - {camera: left_wrist, object: source, phase: pregrasp, mode: record_only}
    - {camera: left_wrist, object: source, phase: grasp, mode: record_only}
    - {camera: left_wrist, object: source, phase: lift, mode: record_only}
    - {camera: left_wrist, object: source, phase: place_hover, mode: record_only}
    - {camera: left_wrist, object: source, phase: place, mode: record_only}
    - {camera: left_wrist, object: source, phase: retreat, mode: record_only}
    - {camera: left_wrist, object: target, phase: pregrasp, mode: record_only}
    - {camera: left_wrist, object: target, phase: grasp, mode: record_only}
    - {camera: left_wrist, object: target, phase: lift, mode: record_only}
    - {camera: left_wrist, object: target, phase: place_hover, mode: record_only}
    - {camera: left_wrist, object: target, phase: place, mode: record_only}
    - {camera: left_wrist, object: target, phase: retreat, mode: record_only}
    - {camera: left_wrist, object: table, phase: pregrasp, mode: min_pixels, min_pixels: 4096}
    - {camera: left_wrist, object: table, phase: grasp, mode: min_pixels, min_pixels: 4096}
    - {camera: left_wrist, object: table, phase: lift, mode: min_pixels, min_pixels: 4096}
    - {camera: left_wrist, object: table, phase: place_hover, mode: min_pixels, min_pixels: 4096}
    - {camera: left_wrist, object: table, phase: place, mode: min_pixels, min_pixels: 4096}
    - {camera: left_wrist, object: table, phase: retreat, mode: min_pixels, min_pixels: 4096}
    - {camera: right_wrist, object: source, phase: pregrasp, mode: min_pixels, min_pixels: 64}
    - {camera: right_wrist, object: source, phase: grasp, mode: min_pixels, min_pixels: 64}
    - {camera: right_wrist, object: source, phase: lift, mode: min_pixels, min_pixels: 64}
    - {camera: right_wrist, object: source, phase: place_hover, mode: record_only}
    - {camera: right_wrist, object: source, phase: place, mode: record_only}
    - {camera: right_wrist, object: source, phase: retreat, mode: record_only}
    - {camera: right_wrist, object: target, phase: pregrasp, mode: record_only}
    - {camera: right_wrist, object: target, phase: grasp, mode: record_only}
    - {camera: right_wrist, object: target, phase: lift, mode: record_only}
    - {camera: right_wrist, object: target, phase: place_hover, mode: min_pixels, min_pixels: 64}
    - {camera: right_wrist, object: target, phase: place, mode: min_pixels, min_pixels: 64}
    - {camera: right_wrist, object: target, phase: retreat, mode: min_pixels, min_pixels: 64}

budgets:
  max_total_samples: 500000
  max_elapsed_s: 300.0
  max_png_count: 1000
  max_png_total_bytes: 67108864
  max_report_bytes: 16777216
