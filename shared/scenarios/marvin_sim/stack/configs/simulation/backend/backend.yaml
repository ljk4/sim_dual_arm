# Marvin stack direct Robot API backend (no task plugin).
robot:
  namespace: /robot
  profile: ../../../profiles/robots/marvin_stack/profile.json
  schemas: ../../../../../../common/interfaces/schemas
  scene: ../scene/marvin_stack.yaml
  control: ../../../../handover/profiles/control/marvin_control.yaml
  stream: ../../../profiles/control/marvin_stream.yaml
  follower: ../../../../handover/profiles/control/marvin_follower.yaml
  velocity_feedforward: true
  reliable_sensors: true

run:
  seed: 0
  capture_hz: 20.0
  realtime_speed: 1.0
  max_catchup_steps: 8

queues:
  owner: 64
  planner: 4
  render_snapshots: 4
  render_outputs: 8
  captures: 32
  events: 1024
  feedback: 64
  accepted_references: 256
  follower_references: 256

limits:
  planner_health_s: 10.0
  renderer_health_s: 5.0
  request_timeout_s: 5.0
  shutdown_s: 10.0
  command_history: 256
  chunk_history: 256

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
