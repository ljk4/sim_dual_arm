# 中文参数说明（维护时优先阅读本段）
# joint_names：16 个控制轴顺序，与 marvin_handover_v1 档案一致。
# target_count：每个执行窗口选用的预测点数；50 ms/点。
# max_target_deviations：参考轨迹与分段线性目标之间允许的最大偏差。
#   臂关节单位 rad，夹爪单位 m；这是跟随预算，不是放宽硬限位。
# max_terminal_tail_duration_s：最后一段参考允许延伸到目标的最长时间。

# Marvin bounded target-follower parameters.  This is a following budget, not
# a relaxation of the profile's joint position/velocity hard limits.
joint_names:
  - left_joint1
  - left_joint2
  - left_joint3
  - left_joint4
  - left_joint5
  - left_joint6
  - left_joint7
  - left_gripper_width
  - right_joint1
  - right_joint2
  - right_joint3
  - right_joint4
  - right_joint5
  - right_joint6
  - right_joint7
  - right_gripper_width

# Twenty selected predictions per window (1.0 s at 50 ms per point).
target_count: 20

# Reference-fidelity budget measured on the real follower: 0.05 rad for arm
# joints and 0.01 m for each total gripper opening.
max_target_deviations:
  [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.01,
   0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.01]

# A final reference may extend past the selected window to reach the target at
# zero velocity, but never beyond three seconds in total.
max_terminal_tail_duration_s: 3.0
