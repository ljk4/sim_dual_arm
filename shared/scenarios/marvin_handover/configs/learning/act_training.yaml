# Marvin 交接诊断短训练；smoke 128 step 与独立 900 s 预算。
# 模型结构与 ACT 适配保持一致；batch/worker 按本机 6 GiB GPU 实测设置。
schema_version: 1
mode: smoke
seed: 20261113
device: cuda
cache_root: var/learning/cache
data:
  config: shared/scenarios/marvin_handover/configs/learning/act_dataset.yaml
  root: var/learning/marvin_handover_diag/dataset
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  # None is intentional: the local official file is loaded explicitly and
  # strictly, so model construction can never trigger an implicit download.
  pretrained_backbone_weights: null
  weights:
    path: build/cache/torch/hub/checkpoints/resnet18-f37072fd.pth
training:
  batch_size: 16
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  amp_dtype: bfloat16
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  val_every_steps: 1000
  save_every_steps: 64
  val_batches: 16
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    # Use every qualified training episode; no static sample filter is applied.
    episodes: all
    validation: false
    reserve_seconds: 900.0
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
    reserve_seconds: 900.0
  full:
    steps: 5000
    split: train
    episodes: all
    validation: true
    reserve_seconds: 900.0
budget:
  # Independent Marvin task budget; no run may exceed it or enter full mode.
  limit_seconds: 900.0
  ledger: var/learning/marvin_handover_diag/training-budget.jsonl
  lock: var/learning/marvin_handover_diag/.training-budget.lock
  stop_margin_seconds: 30.0
  min_free_bytes: 2147483648
checkpoint:
  root: var/learning/marvin_handover_diag/runs
  keep_latest: true
  keep_best: true
  keep_final: true
  min_free_bytes: 2147483648
  save_before_exit: true
logging:
  root: var/learning/marvin_handover_diag/runs
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
