# Bounded pre-commit smoke training on one real training episode, with a
# separate budget ledger, checkpoint and log root. Steps are set below.
# The formal training recipe and its 5000-step full mode are unchanged.
schema_version: 1
mode: smoke
seed: 910002
device: cuda
cache_root: /data/diagnostics/precommit-smoke-20261112/cache
data:
  config: /workspace/shared/scenarios/panda_stack_diag/configs/precommit_dataset.container.yaml
  root: /data/diagnostics/precommit-smoke-20261112/dataset
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  pretrained_backbone_weights: null
  weights:
    path: /build/cache/torch/hub/checkpoints/resnet18-f37072fd.pth
training:
  batch_size: 8
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  amp_dtype: bfloat16
  lr: 0.00001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 1
  val_every_steps: 1000
  save_every_steps: 16
  val_batches: 8
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    episodes: [0]
    validation: false
    reserve_seconds: 900.0
  overfit:
    steps: 64
    split: train
    episodes: [0]
    validation: false
    reserve_seconds: 900.0
  full:
    steps: 128
    split: train
    episodes: all
    validation: true
    reserve_seconds: 900.0
budget:
  limit_seconds: 14400.0
  ledger: /data/diagnostics/precommit-smoke-20261112/training-budget.jsonl
  lock: /data/diagnostics/precommit-smoke-20261112/.training-budget.lock
  stop_margin_seconds: 30.0
  min_free_bytes: 2147483648
checkpoint:
  root: /data/diagnostics/precommit-smoke-20261112/runs
  keep_latest: true
  keep_best: true
  keep_final: true
  min_free_bytes: 2147483648
  save_before_exit: true
logging:
  root: /data/diagnostics/precommit-smoke-20261112/runs
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
