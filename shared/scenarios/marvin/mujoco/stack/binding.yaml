# Scenario binding for the fixed-base Marvin stack task.
robot_id: marvin
task_id: stack
description: >-
  Fixed-base dual-Marvin single-arm cube stacking: MuJoCo simulation, ROS 2
  program teacher and LeRobot ACT learning recipes.

backend:
  kind: simulation
  implementation: mujoco
  task_type: stack

runtime:
  implementation: ros2

learning:
  implementation: lerobot
  adapter: act

profiles:
  robot: profiles/robot/profile.json
  observation: ../../../../robots/marvin/profiles/observations/marvin_rgb_joint.json
  action: ../../../../robots/marvin/profiles/actions/marvin_joint_position.json

recipes:
  simulation_teacher: configs/simulation/backend/backend_stack_teacher.yaml
  simulation_policy: configs/simulation/backend/backend_stack_policy.yaml
  runtime_teacher: configs/runtime/teacher_collect.yaml
  runtime_policy: configs/runtime/policy_rollout.yaml
  campaign: configs/runtime/stack_campaign.yaml
  dataset: configs/learning/act_dataset.yaml
  training: configs/learning/act_training.yaml
  policy_service: configs/learning/policy.yaml
  evaluation: configs/runtime/evaluation.yaml

interfaces:
  common_ros:
    - robot_api_msgs
    - sim_api_msgs
  extension_ros:
    - ../../../../robots/marvin/extensions/ros/marvin_teacher_api_msgs
  teacher_api: marvin_teacher_api_msgs.teacher_chunk
  policy_api: bimanual.policy

source_roots:
  - ../../../../robots/marvin
artifact_roots:
  - /data
