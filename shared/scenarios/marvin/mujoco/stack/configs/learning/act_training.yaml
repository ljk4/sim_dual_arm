# Marvin stack ACT training configuration.
mode: smoke
seed: 20261120
device: cuda
cache_root: output/marvin/mujoco/stack/debug/learning-cache
data:
  config: shared/scenarios/marvin/mujoco/stack/configs/learning/act_dataset.yaml
  root: output/marvin/mujoco/stack/datasets/lerobot
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  sample_filter: shared/scenarios/marvin/mujoco/stack/configs/learning/act_sample_filter.yaml
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  pretrained_backbone_weights: null
  weights:
    path: third_party/weights/resnet18-f37072fd.pth
training:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  amp_dtype: bfloat16
  lr: 0.0001
  lr_backbone: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  val_every_steps: 1000
  val_batches: 512
  deterministic: true
  visual_augmentation:
    enabled: true
    brightness: 0.15
    contrast: 0.15
    saturation: 0.15
    hue: 0.03
    noise_std: 0.02
    blur_prob: 0.3
    camera_dropout_prob: 0.10
modes:
  smoke:
    steps: 128
    split: train
    episodes: all
    validation: false
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
  full:
    steps: 20000
    split: train
    episodes: all
    validation: true
checkpoint:
  root: output/marvin/mujoco/stack/models
logging:
  root: output/marvin/mujoco/stack/logs/training
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
