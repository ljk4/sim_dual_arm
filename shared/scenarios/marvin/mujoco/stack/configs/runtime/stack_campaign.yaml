# Marvin stack campaign collection seeds and export quality thresholds.
diagnostic: false

budget:
  pilot_seed_first: 1000
  formal_seed_first: 2000
  min_free_bytes: 5368709120

paths:
  attempts_root: output/marvin/mujoco/stack/datasets/raw
  ledger: output/marvin/mujoco/stack/logs/collection/attempts.jsonl
  lock: output/marvin/mujoco/stack/logs/collection/.ledger.lock
  run_lock: output/marvin/mujoco/stack/logs/collection/.run.lock
  formal_select: output/marvin/mujoco/stack/datasets/raw/formal-select.json
  required_paths:
    - shared/scenarios/marvin/mujoco/stack/configs/runtime/teacher_collect.yaml
    - shared/scenarios/marvin/mujoco/stack/configs/simulation/backend/backend_stack_teacher.yaml
    - shared/scenarios/marvin/mujoco/stack/configs/simulation/scene/marvin_stack.yaml
    - shared/scenarios/marvin/mujoco/stack/configs/simulation/scene/marvin_stack_task.yaml
    - shared/scenarios/marvin/mujoco/stack/configs/simulation/scene/stack_paths.yaml
    - shared/robots/marvin/extensions/ros/marvin_teacher_api_msgs/srv/GetTeacherChunk.srv
    - shared/robots/marvin/extensions/ros/marvin_teacher_api_msgs/msg/TeacherCapability.msg
    - shared/scenarios/marvin/mujoco/stack/profiles/robot/profile.json
    - shared/robots/marvin/profiles/observations/marvin_rgb_joint.json
    - shared/robots/marvin/profiles/actions/marvin_joint_position.json
    - shared/robots/marvin/profiles/control/marvin_control.yaml
    - shared/robots/marvin/profiles/control/marvin_follower.yaml
    - runtime/ros2/docker/docker-compose.yml
  sdk_marker: output/build/ros-dev/contracts.json

launch:
  timeout_s: 600.0
  stop_grace_s: 45.0

quality:
  sidecar: export/quality.json
  max_blackout_s: 0.35
  min_qualified_ratio: 0.85
  phases: &stack_phases
    [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
  required_phases: [close, lift, lower, open]
  rules:
    - camera: global
      object: source
      phases: *stack_phases
      mode: required
      min_pixels: 32
    - camera: global
      object: target
      phases: *stack_phases
      mode: required
      min_pixels: 64
    - camera: right_wrist
      object: source
      phases: [grasp, close, lift, transport, lower, open]
      mode: required
      min_pixels: 64
    - camera: right_wrist
      object: source
      phases: [pregrasp, retreat, stable]
      mode: record_only
      min_pixels: 16
    - camera: right_wrist
      object: target
      phases: [transport, lower]
      mode: required
      min_pixels: 32
    - camera: right_wrist
      object: target
      phases: [pregrasp, grasp, close, lift, open, retreat, stable]
      mode: record_only
      min_pixels: 16
    - camera: global
      object: table
      phases: *stack_phases
      mode: record_only
      min_pixels: 4096

export:
  max_labels: 1400
