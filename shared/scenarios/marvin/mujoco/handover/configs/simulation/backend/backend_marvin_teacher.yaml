# Marvin 交接任务与程序示教后端；引用路径相对本文件。
# Teacher 能力由 Marvin 共享 Teacher 扩展声明（marvin_teacher_api_msgs.teacher_chunk），
# 通用 worker 和 ROS 节点不按方案名选择扩展。
robot:
  namespace: /robot
  profile: ../../../profiles/robot/profile.json
  schemas: ../../../../../../../common/interfaces/schemas
  scene: ../scene/marvin_handover.yaml
  control: ../../../../../../../robots/marvin/profiles/control/marvin_control.yaml
  stream: ../../../profiles/control/marvin_stream.yaml
  follower: ../../../../../../../robots/marvin/profiles/control/marvin_follower.yaml
  task: ../scene/marvin_handover_task.yaml
  task_type: handover
  task_mode: teacher
  # Segmentation counts for per-phase data-quality audits.  Rendering output
  # and task physics are otherwise unchanged.
  render_quality:
    enabled: true
  # Affine PD reference-velocity feedforward; hard limits unchanged.
  velocity_feedforward: true
  reliable_sensors: true

run:
  seed: 0
  capture_hz: 20.0
  realtime_speed: 1.0
  max_catchup_steps: 8

queues:
  owner: 64
  planner: 4
  render_snapshots: 32
  render_outputs: 32
  captures: 32
  events: 2048
  feedback: 64
  follower_references: 512

limits:
  planner_health_s: 30.0
  renderer_health_s: 5.0
  request_timeout_s: 10.0
  shutdown_s: 10.0
  command_history: 256
  chunk_history: 512

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
