# Marvin 交接正式数据转换。
# 正式训练输入，路径相对项目根。
fps: 20
chunk_size: 60
# 动作标签对齐观测后一个采样周期（50 ms）。
action_lead_ns: 50000000
state_dim: 16
camera_names: [global, left_wrist, right_wrist]
camera_width: 320
camera_height: 240
task_text: >-
  Pick up the block with the left arm, hand it to the right arm, and place it
  into the box.
profile: shared/scenarios/marvin/mujoco/handover/profiles/robot/profile.json
select: output/marvin/mujoco/handover/datasets/raw/formal-select.json
output_root: output/marvin/mujoco/handover/datasets/lerobot
cache_root: output/marvin/mujoco/handover/debug/learning-cache
# 相对单局采集目录的导出路径，Runtime 写入 <attempt>/export。
attempt_export_glob: "export"
verify_png_pixels: true
require_quality: true
validation_percent: 10
lerobot:
  source_revision: 7e241bd630a3719a56157a497ce5d08f244784f1
  rgb_encoder:
    vcodec: h264
    g: 2
    crf: 18
    preset: veryfast
  video_backend: pyav
  encoder_threads: 4
  image_writer_threads: 4
