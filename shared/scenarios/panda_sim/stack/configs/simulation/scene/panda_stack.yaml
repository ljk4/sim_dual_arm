# 基础场景；右腕相机视场角 85°，匹配 panda_stack_v1 档案。
robot:
  # The simulation resolves the fixed-version model from its own assets/ root.
  assembly: panda

physics:
  timestep: 0.002
  gravity: [0.0, 0.0, -9.81]
  integrator: implicitfast
  object_friction: [1.0, 0.005, 0.0001]

column:
  radius: 0.12
  height: 1.20
  rgba: [0.35, 0.35, 0.38, 1.0]

mounts:
  base_x: 0.25
  base_y: 0.0
  base_z: 1.0
  yaw_deg: 90.0
  bracket_length: 0.18
  bracket_width: 0.06
  bracket_height: 0.06
  tcp_position: [0.0, 0.0, 0.1034]
  rgba: [0.22, 0.22, 0.24, 1.0]

table:
  center_xy: [0.0, 0.65]
  size_xy: [1.20, 0.70]
  top_z: 0.75
  thickness: 0.05
  rgba: [0.55, 0.45, 0.32, 1.0]

objects:
  - name: source
    half_extents: [0.02, 0.02, 0.02]
    nominal_xy: [0.20, 0.55]
    mass: 0.04
    rgba: [0.80, 0.20, 0.18, 1.0]
    randomization:
      xy_m: 0.03
      yaw_deg: 10.0
  - name: target
    half_extents: [0.03, 0.03, 0.03]
    nominal_xy: [0.36, 0.55]
    mass: 0.06
    rgba: [0.18, 0.38, 0.82, 1.0]
    randomization:
      xy_m: 0.03
      yaw_deg: 10.0

cameras:
  # Camera looks along its local -Z axis with local +Y up.  All poses are
  # fixed local extrinsics; nothing tracks an object or the robot.
  global:
    parent: column
    position: [0.0, 0.03, 1.35]
    # Look-at (0.28, 0.55, 0.78) from the column position above, world +Z up.
    quaternion_wxyz: [0.8925197558974589, 0.37900400432426573, -0.09555357239318052, -0.2250199209888173]
    fovy: 60.0
    width: 320
    height: 240
  left_wrist:
    parent: left_hand
    # Fixed local extrinsic: optical axis roughly along hand +Z with an 8 deg
    # downward tilt toward the TCP.  No per-frame target tracking.
    position: [0.10, 0.0, 0.02]
    quaternion_wxyz: [0.0, 0.9975640502598242, 0.0, 0.0697564737441253]
    fovy: 85.0
    width: 320
    height: 240
  right_wrist:
    parent: right_hand
    # Mirrored hand body uses the same fixed local extrinsic.
    position: [0.10, 0.0, 0.02]
    quaternion_wxyz: [0.0, 0.9975640502598242, 0.0, 0.0697564737441253]
    fovy: 85.0
    width: 320
    height: 240

reset:
  # Upstream Panda home pose, 7 arm joints in radians.  Joint 5 is offset from
  # zero so the wrist is not in its j4/j6 collinear singularity at reset.
  home_joint_positions: [0.0, 0.0, 0.0, -1.57079, 0.3, 1.57079, -0.7853]
  # Total opening of both finger slides; each finger gets half of this.
  gripper_total_opening: 0.08
