# ACT 的 smoke/overfit/full 训练共用模型与训练参数；路径相对项目根。
schema_version: 1
mode: smoke
seed: 20261102
device: cuda
cache_root: var/panda_sim/stack/datasets/.cache
data:
  config: shared/scenarios/panda_sim/stack/configs/learning/act_dataset.yaml
  root: var/panda_sim/stack/datasets/lerobot
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
  # full 模式按此规则在内存中抽稀静止冗余锚点；smoke/overfit 不启用。
  sample_filter: shared/scenarios/panda_sim/stack/configs/learning/act_sample_filter.yaml
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  # None is intentional: the local official file is loaded explicitly and
  # strictly, so model construction can never trigger an implicit download.
  pretrained_backbone_weights: null
  weights:
    path: third_party/weights/resnet18-f37072fd.pth
training:
  batch_size: 40
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  amp_dtype: bfloat16
  lr: 0.0001
  # 5,000-step runs (~10 epochs) require 1e-4 on ResNet18 to localize small objects cleanly;
  # setting 1e-5 here underfitted val_l1 (0.0465 vs 0.0132). Keep grouped override configurable.
  lr_backbone: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  val_every_steps: 1000
  # Covers all five full validation episodes (not only episode 0).
  val_batches: 512
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    episodes: [0, 1]
    validation: false
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
  full:
    steps: 5000
    split: train
    episodes: all
    validation: true
checkpoint:
  root: var/panda_sim/stack/models
logging:
  root: var/panda_sim/stack/logs/training
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
