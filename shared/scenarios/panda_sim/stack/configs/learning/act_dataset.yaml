# 正式采集结果转为 45 条训练、5 条验证数据；路径相对项目根。
schema_version: 1
diagnostic: false
fps: 20
chunk_size: 60
action_lead_ns: 50000000
state_dim: 16
camera_names: [global, left_wrist, right_wrist]
camera_width: 320
camera_height: 240
task_text: "Pick up the red source cube and place it on the blue target cube."
profile: shared/scenarios/panda_sim/stack/profiles/robots/panda_stack_learning_v1/profile.json
select: var/panda_sim/stack/datasets/raw/formal-select.json
output_root: var/panda_sim/stack/datasets/lerobot
cache_root: var/panda_sim/stack/datasets/.cache
# The campaign writes each accepted export directly at <attempt>/export.
attempt_export_glob: "export"
verify_png_pixels: true
require_quality: true
expected:
  formal_episodes: 50
  training_episodes: 45
  validation_episodes: 5
  # Zero-based positions in the first 50 qualified successes.
  validation_positions: [9, 19, 29, 39, 49]
lerobot:
  source_revision: 7e241bd630a3719a56157a497ce5d08f244784f1
  rgb_encoder:
    vcodec: h264
    g: 2
    crf: 18
    preset: veryfast
  video_backend: pyav
  video_files_size_mb: 256
  data_files_size_mb: 256
  encoder_threads: 1
  image_writer_threads: 0
