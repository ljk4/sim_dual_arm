# Scenario binding v1 for the real dual-Panda stack task.
#
# This file records selection only.  Numeric recipes stay in the referenced
# files and remain their single source of truth; profiles are the public
# robot/observation/action contracts.  Models are deliberately not pinned here:
# collection must validate without a model, while inference preparation must
# supply a real verified bundle explicitly (--bundle) or bind one here later.
# Paths resolve against this file's directory, never the caller's cwd.
schema_version: 1
scenario_id: panda_stack
description: >-
  Dual-Panda stack task: MuJoCo simulation, ROS 2 execution runtime and
  LeRobot ACT learning recipes.

backend:
  kind: simulation
  implementation: mujoco
  task_type: stack

runtime:
  implementation: ros2

learning:
  implementation: lerobot
  adapter: act

profiles:
  robot: profiles/robots/panda_stack_learning_v1/profile.json
  observation: profiles/observations/panda_rgb_joint_v1.json
  action: profiles/actions/panda_joint_position_v1.json

recipes:
  simulation_teacher: configs/simulation/backend/backend_stack_teacher.yaml
  simulation_policy: configs/simulation/backend/backend_stack_act_chunked.yaml
  runtime_teacher: configs/runtime/teacher_collect.yaml
  runtime_policy: configs/runtime/policy_rollout.yaml
  campaign: configs/runtime/experiments/stack_campaign.yaml
  dataset: configs/learning/act_dataset.yaml
  training: configs/learning/act_training.yaml
  policy_service: configs/learning/policy_temporal.yaml

interfaces:
  # Common ROS packages.  robot_api_msgs is the core contract; sim_api_msgs is
  # the optional simulation task lifecycle.  The fixed 60x16 stack Teacher is a
  # scenario extension and is selected explicitly below.
  common_ros:
    - robot_api_msgs
    - sim_api_msgs
  extension_ros:
    - extensions/ros/panda_stack_api_msgs
  # Explicit Teacher wire capability.  The extension package advertises the
  # same identifier; an old server advertising "teacher_chunk" is rejected.
  teacher_api: panda_stack_api_msgs.teacher_chunk.v1
  policy_api: bimanual.policy.v1

models:
  bundle: null

# The shared tree is the only source scope this scenario currently uses.
# Artifacts (verified bundles, prepared runs) are deployment data under /data.
source_roots:
  - ../..
artifact_roots:
  - /data

references: []
