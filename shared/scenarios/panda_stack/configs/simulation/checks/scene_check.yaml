# 中文参数说明（维护时优先阅读本段）
# ik.*：逆运动学求解步长、迭代次数、位置/姿态容差、代价权重、阻尼和求解器。
# clearance.*：最小净空、碰撞检测距离、关节采样步长、单段/总采样上限。
# targets.*：抓取、抬升、放置、退开等关键位姿高度和放置净空。
# visibility.rules：每个相机/物体/阶段的最小可见像素规则；required 会门禁，record_only 仅记录。
# budgets.*：布局数量、PNG 证据总字节数和报告大小上限。
# seeds：普通布局种子列表。
# boundary_xy_corners/boundary_yaw_signs：物体随机域边界布局的 XY 角和 yaw 符号。
# min_visible_pixels：每个相机/物体的最小可见像素。
# max_layouts：普通种子加边界布局的总上限。
# throughput.*：渲染吞吐测试的预热组数和测量组数。

# DSH-016 static scene visibility check parameters.
# Names must match shared/scenarios/panda_stack/configs/simulation/scene/panda_stack.yaml exactly.
schema_version: 1
# Normal engineering seeds; each is a Scene.reset(seed) initial layout.
seeds: [11, 23, 37]
# Each object gets the four XY corners of its configured randomization domain
# and both yaw extrema, for eight per object.  The joint Cartesian product of
# two objects is 64 boundary layouts.  These are diagnostic initial layouts,
# never live-scene object teleports.
boundary_xy_corners:
  - [-1, -1]
  - [-1, 1]
  - [1, -1]
  - [1, 1]
boundary_yaw_signs: [-1, 1]
# Per-camera, per-object minimum visible segmented pixels.
min_visible_pixels:
  global:
    source: 64
    target: 64
  left_wrist:
    source: 32
    target: 32
  right_wrist:
    source: 32
    target: 32
# Hard upper bound: normal seeds plus boundary layouts must fit.
max_layouts: 100
# RGB-only measurement groups; one group renders all three named cameras.
throughput:
  warmup_groups: 3
  measure_groups: 20
