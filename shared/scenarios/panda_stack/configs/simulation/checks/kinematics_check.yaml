# IK、碰撞净空与关键路点检查预算。
schema_version: 1

ik:
  dt_s: 0.01
  max_iterations: 250
  position_tolerance_m: 0.0005
  orientation_tolerance_rad: 0.005
  posture_cost: 0.0005
  position_cost: 1.0
  orientation_cost: 1.0
  lm_damping: 0.001
  # mink 1.3 / DAQP; no pseudo-inverse implementation is used.
  solver: daqp
  # Numerical seed for the first target in each layout; the remaining qpos
  # still comes from that layout's frozen initial snapshot.  This is not the
  # actual path start: initial -> pregrasp is always checked from Scene home.
  initial_right_joint_positions:
    [0.6611657875566201, 1.053952789173405, -0.47077198599796316,
     -1.8999275750261582, 1.0656643185801171, 2.6750836691327793,
     1.7547643964342687]

clearance:
  # Signed mj_geomDistance clearance required at every sampled path endpoint
  # and intermediate sample.
  minimum_clearance_m: 0.002
  collision_detection_distance_m: 0.03
  # Linear right-arm joint sampling: at most 0.01 rad between samples, both
  # endpoints included, at most 2000 samples per segment.
  sample_step_rad: 0.01
  max_samples_per_segment: 2000
  max_total_samples: 200000

targets:
  # All heights are offsets from the initial object centre, except place_pose
  # whose z is table_top + 2*target_half_z + source_half_z + place_clearance_m.
  # The source/target XY come from the frozen initial object snapshot.
  pregrasp_height_m: 0.12
  grasp_height_m: 0.004
  lift_height_m: 0.20
  place_hover_height_m: 0.16
  place_clearance_m: 0.006
  retreat_height_m: 0.20

visibility:
  # Every (camera, object, phase) pair is covered exactly once.  required
  # rules must pass; record_only rules are retained in the report but do not
  # gate the run.  All thresholds are explicit per phase.
  rules:
    - camera: right_wrist
      object: source
      phases: [pregrasp, grasp_pose, lift_pose]
      mode: required
      min_pixels: 64
    - camera: right_wrist
      object: source
      phases: [place_hover, place_pose, retreat]
      mode: record_only
    - camera: right_wrist
      object: target
      phases: [pregrasp, grasp_pose, lift_pose]
      mode: record_only
    - camera: right_wrist
      object: target
      phases: [place_hover, place_pose, retreat]
      mode: required
      min_pixels: 64

    - camera: global
      object: target
      phases: [pregrasp, grasp_pose, lift_pose, place_hover, place_pose, retreat]
      mode: required
      min_pixels: 64
    - camera: global
      object: source
      phases: [pregrasp, lift_pose, place_hover, place_pose, retreat]
      mode: required
      min_pixels: 32
    - camera: global
      object: source
      phases: [grasp_pose]
      mode: record_only

    - camera: left_wrist
      object: table
      phases: [pregrasp, grasp_pose, lift_pose, place_hover, place_pose, retreat]
      mode: required
      min_pixels: 4096
    - camera: left_wrist
      object: source
      phases: [pregrasp, grasp_pose, lift_pose, place_hover, place_pose, retreat]
      mode: record_only
    - camera: left_wrist
      object: target
      phases: [pregrasp, grasp_pose, lift_pose, place_hover, place_pose, retreat]
      mode: record_only

budgets:
  max_layouts: 100
  # PNG evidence is capped at 128 MiB in total.
  max_png_bytes: 134217728
  max_report_bytes: 8388608
