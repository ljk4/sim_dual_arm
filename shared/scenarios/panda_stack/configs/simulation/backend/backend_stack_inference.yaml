# 中文参数说明（维护时优先阅读本段）
# robot.namespace：ROS 命名空间。
# robot.profile：机器人 profile 路径。
# robot.schemas：shared/common/interfaces/schemas 路径。
# robot.scene：场景 YAML，定义物理、物体、相机和复位位姿。
# robot.control：运动控制器参数。
# robot.stream：连续动作块流超时参数。
# robot.follower：受限跟随器参数。
# robot.task：任务成功判定与教师参数。
# robot.render_quality.enabled：是否在同一次渲染快照上统计可见像素质量。
# robot.velocity_feedforward：是否启用参考速度前馈，不改变硬限位。
# robot.reliable_sensors：是否使用可靠传感器 QoS。
# robot.task_mode：teacher 表示程序示教，inference 表示无教师推理。
# run.seed：默认场景复位种子；prepare 会用命令行 seed 覆盖。
# run.capture_hz：完整状态/三路图像快照频率，单位 Hz。
# run.realtime_speed：仿真时间相对墙钟速度，1.0 为实时，0.5 为半速。
# run.max_catchup_steps：单次主循环最多追赶的物理步数。
# queues.owner/planner/render_snapshots/render_outputs/captures/events/feedback/accepted_references/follower_references：各线程间有界队列容量。
# limits.planner_health_s：规划线程健康超时，单位 s。
# limits.renderer_health_s：渲染线程健康超时，单位 s。
# limits.request_timeout_s：请求等待超时，单位 s。
# limits.shutdown_s：优雅关闭预算，单位 s。
# limits.command_history：命令历史容量。
# limits.chunk_history：动作块历史容量。
# logging.*：事件日志队列、单条/单文件/总大小、关闭超时、刷新间隔、控制台开关。

# Evaluation-only stack-task deployment.  It enables Prepare/Start/GetState
# and independent success evaluation but no teacher capability: no IK/teacher
# plan is constructed and GetTeacherChunk is rejected.
robot:
  namespace: /robot
  profile: ../../../profiles/robots/panda_stack_learning_v1/profile.json
  schemas: ../../../../../common/interfaces/schemas
  scene: ../scene/panda_stack_learning.yaml
  control: ../../../profiles/control/panda_control_v1.yaml
  stream: ../../../profiles/control/panda_stream_v1.yaml
  follower: ../../../profiles/control/panda_follower_v1.yaml
  task: ../scene/panda_stack_task.yaml
  # Optional read-only segmentation counts on the same render snapshot.
  render_quality:
    enabled: true
  # Affine PD reference-velocity feedforward; hard limits/tolerances unchanged.
  velocity_feedforward: true
  reliable_sensors: true
  task_mode: inference

run:
  seed: 0
  capture_hz: 20.0
  realtime_speed: 1.0
  max_catchup_steps: 8

queues:
  owner: 64
  planner: 4
  render_snapshots: 4
  render_outputs: 8
  captures: 32
  events: 1024
  feedback: 64
  accepted_references: 256
  follower_references: 256

limits:
  planner_health_s: 10.0
  renderer_health_s: 5.0
  request_timeout_s: 5.0
  shutdown_s: 10.0
  command_history: 256
  chunk_history: 256

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
