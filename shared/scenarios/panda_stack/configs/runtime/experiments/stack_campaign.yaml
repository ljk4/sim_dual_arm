# Panda 堆叠采集预算、种子与正式筛选规则。
schema_version: 1

budget:
  # DSH-034 pilot: at most ten complete attempts.  Seeds 1000..1007 cover
  # teacher rollouts and label replays; 1008..1009 are reserved for ACT smoke
  # inference.  Label replay consumes a pilot attempt and never starts an
  # unaccounted rollout.
  pilot_seed_first: 1000
  pilot_seed_last: 1009
  pilot_max_attempts: 10
  pilot_act_reserved_attempts: 2
  pilot_teacher_seed_last: 1007
  pilot_label_replay_max: 2

  formal_seed_first: 10000
  formal_seed_last: 10099
  formal_max_attempts: 100
  formal_target_qualified: 50
  # Zero-based positions in the qualified list: 10th, 20th, 30th, 40th, 50th.
  formal_validation_qualified_indices: [9, 19, 29, 39, 49]

  test_seed_first: 20000
  test_seed_last: 20019
  test_max_attempts: 20
  # Explicit ACT evaluation purpose; shares the fixed test seeds and total cap
  # with `test`, so a seed can never be consumed twice.
  evaluation_max_attempts: 20

  # 30 GiB including failed attempts and every raw byte under the attempt root.
  max_raw_bytes: 32212254720
  # Reserve room for the final manifest/task sidecars and disk headroom.
  reserve_bytes: 2147483648
  # Conservative single-attempt estimate; measured bytes replace it on finish.
  estimated_attempt_bytes: 268435456
  min_free_bytes: 5368709120

paths:
  attempts_root: var/panda_stack/logs/campaign/attempts
  ledger: var/panda_stack/logs/campaign/attempts.jsonl
  lock: var/panda_stack/logs/campaign/.ledger.lock
  run_lock: var/panda_stack/logs/campaign/.run.lock
  formal_select: var/panda_stack/datasets/formal-select.json
  # Created/checked before a reservation; all must exist.
  required_paths:
    - shared/scenarios/panda_stack/configs/runtime/teacher_collect.yaml
    - shared/scenarios/panda_stack/configs/runtime/policy_rollout.yaml
    - shared/scenarios/panda_stack/configs/learning/policy_temporal.yaml
    - learning/lerobot/docker/docker-compose.yml
    - runtime/ros2/docker/docker-compose.yml
    - shared/scenarios/panda_stack/configs/simulation/backend/backend_stack_teacher.yaml
    - shared/scenarios/panda_stack/configs/simulation/scene/panda_stack_task.yaml
    - shared/scenarios/panda_stack/extensions/ros/panda_stack_api_msgs/srv/GetTeacherChunk.srv
    - shared/scenarios/panda_stack/extensions/ros/panda_stack_api_msgs/msg/TeacherCapability.msg
  sdk_marker: build/ros-dev/contracts.json

launch:
  # The supervisor supplies the actual ROS/container command.  Placeholders:
  # {seed} {run_id} {episode_id} {attempt_dir} {config} {project_python}
  command: []
  # Best-effort cleanup after timeout/signal; must stop only this attempt's
  # compose project/process group.
  cleanup_command: []
  timeout_s: 180.0

quality:
  # A rollout is not qualified unless the exported quality sidecar says true.
  # The export writes it at <attempt>/export/quality.json.
  # Rules mirror the accepted kinematics_check.visibility thresholds and modes:
  # required gates qualification, record_only is reported and never gates.
  sidecar: export/quality.json
  max_blackout_s: 0.35
  min_qualified_ratio: 0.85
  # Phase order of the stack teacher.  Export derives intervals from the
  # accepted-chunk phase events; no task phase list is hard-coded in the tool.
  phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
  rules:
    - camera: right_wrist
      object: source
      phases: [pregrasp, grasp, close, lift]
      mode: required
      min_pixels: 64
    - camera: right_wrist
      object: source
      phases: [transport, lower, open, retreat, stable]
      mode: record_only
      min_pixels: 64
    - camera: right_wrist
      object: target
      phases: [pregrasp, grasp, close, lift]
      mode: record_only
      min_pixels: 64
    - camera: right_wrist
      object: target
      phases: [transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 64
    - camera: global
      object: target
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 64
    - camera: global
      object: source
      phases: [pregrasp, lift, transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 32
    - camera: global
      object: source
      phases: [grasp, close]
      mode: record_only
      min_pixels: 32
    - camera: left_wrist
      object: table
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 4096
    - camera: left_wrist
      object: source
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: record_only
      min_pixels: 64
    - camera: left_wrist
      object: target
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: record_only
      min_pixels: 64

export:
  # Bounded label count for one stack episode (30 s at 20 Hz plus start-up).
  max_labels: 700
