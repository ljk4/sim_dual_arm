# 通过方案专用 Teacher 能力采集，档案路径相对本文件。
schema_version: 1
robot_profile: ../../profiles/robots/panda_stack_learning_v1/profile.json
observation_schema: ../../profiles/observations/panda_rgb_joint_v1.json
action_schema: ../../profiles/actions/panda_joint_position_v1.json
control_constraints: ../../profiles/control/panda_control_v1.yaml
follower_config: ../../profiles/control/panda_follower_v1.yaml
robot_namespace: /robot

action_source: teacher

# The fixed stack Teacher lives in panda_stack_api_msgs, not sim_api_msgs.
# Runtime selects its client adapter from this capability identifier.
teacher_api: panda_stack_api_msgs.teacher_chunk.v1

lease_duration_ns: 2000000000
renew_interval_ns: 500000000
command_acceptance_ns: 500000000
startup_timeout_s: 30.0
call_timeout_s: 5.0
command_timeout_s: 8.0

reset:
  enabled: true
  seed: 0

observation:
  reliable: true
  # max_skew_ns / max_age_ns come from the observation profile.
  wall_arrival_timeout_s: 1.5
  capacity: 32

control:
  submit_query_retries: 2
  poll_interval_s: 0.02
  stop_timeout_s: 8.0
  terminal_timeout_s: 20.0

# A 30 s task at 0.5 s per executed ten-point window needs at least 60
# chunks.  256 is the hard bound; only the actually executed windows become
# labels, never the full 60-point raw prediction.
teacher:
  chunk_size: 60
  action_period_ns: 50000000
  initial_lead_ns: 250000000
  max_chunks: 256
  total_sim_deadline_ns: 30000000000
  total_wall_deadline_s: 60.0
  prepare_timeout_s: 12.0
  start_timeout_s: 5.0
  chunk_deadline_s: 2.0
  poll_interval_s: 0.02
  termination_mode: task
  # Stop 1 s before the 30 s judge deadline: the 0.2 s measured stable window
  # plus bounded braking at the configured max velocity/acceleration.
  task_stop_margin_s: 1.0
  task_sim_budget_ns: 30000000000
  task_id: panda-stack

motions: []

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
recording:
  queue_capacity: 1024
  max_pending_bytes: 67108864
  startup_timeout_s: 5.0
  close_timeout_s: 5.0
