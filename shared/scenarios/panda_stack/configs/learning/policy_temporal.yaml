# ACT Policy 服务与时间融合配方，模型由准备入口绑定。
schema_version: 1

model:
  bundle_dir: /opt/act-bundle
  robot_profile_path: ../../profiles/robots/panda_stack_learning_v1/profile.json
  observation_schema_path: ../../profiles/observations/panda_rgb_joint_v1.json
  action_schema_path: ../../profiles/actions/panda_joint_position_v1.json
  device: cuda
  # Formal evaluation must reject synthetic/teacher/test evidence.
  require_formal: true
  # Explicitly approved after final-model range checks; arms remain strict.
  # Raw ACT and admitted targets are saved separately for every prediction.
  gripper_max_correction_m: 0.03
  # Provider-side temporal ensemble aligned to absolute simulation time.
  # Positive values retain older predictions; unset/None keeps it disabled.
  temporal_ensemble_coeff: 0.01

service:
  bind_address: 0.0.0.0
  port: 50051
  max_workers: 4
  max_message_bytes: 16777216
  max_sessions: 8
  max_open_requests: 128
  max_request_cache: 128
  # 60 x 50 ms targets span 50 ms .. 3000 ms.  The RPC deadline is bounded but
  # does not claim the model can be interrupted mid-kernel.
  predict_deadline_s: 3.0
  open_deadline_s: 5.0
  close_deadline_s: 5.0
  test_only: false
  protocol_major: 1
  stateful: true
  task_id: panda-stack
  task_text: Pick up the red source cube and place it on the blue target cube.

logging:
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
