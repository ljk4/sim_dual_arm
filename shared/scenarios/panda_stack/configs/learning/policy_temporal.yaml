# 中文参数说明（维护时优先阅读本段）
# model.bundle_dir：ACT bundle 根目录。
# model.robot_profile_path/observation_schema_path/action_schema_path：机器人、观测和动作契约文件。
# model.device：推理设备，cuda 或 cpu。
# model.require_formal：是否拒绝 synthetic/teacher/test 等非正式数据来源。
# model.gripper_max_correction_m：夹爪原始动作允许的最大修正量，单位 m。
# model.temporal_ensemble_coeff：时间融合系数；正值保留更多旧预测，未设置则关闭。
# service.bind_address/port：gRPC 监听地址和端口。
# service.max_workers：gRPC 工作线程数。
# service.max_message_bytes：单条 gRPC 消息大小上限。
# service.max_sessions/max_open_requests/max_request_cache：会话和请求缓存上限。
# service.predict_deadline_s/open_deadline_s/close_deadline_s：各 RPC 超时，单位 s。
# service.test_only：是否仅用于测试。
# service.protocol_major：Policy 协议主版本。
# service.stateful：策略是否为有状态会话。
# service.task_id/task_text：任务身份和文本。
# logging.*：Policy 服务事件日志容量、文件大小和刷新设置。

# Named, ROS-free ACT Policy service.
#
# This file intentionally contains no model/processor/profile/schema digests:
# the loader derives every identity from the bundle and the shipped profile
# documents at startup, verifies their consistency and snapshots the resolved
# contract next to the service log.  `bundle_dir` may be outside the
# repository and is mounted read-only by the runtime.
schema_version: 1

model:
  bundle_dir: /opt/act-bundle
  robot_profile_path: ../../profiles/robots/panda_stack_learning_v1/profile.json
  observation_schema_path: ../../profiles/observations/panda_rgb_joint_v1.json
  action_schema_path: ../../profiles/actions/panda_joint_position_v1.json
  device: cuda
  # Formal evaluation must reject synthetic/teacher/test evidence.
  require_formal: true
  # Explicitly approved after final-model range checks; arms remain strict.
  # Raw ACT and admitted targets are saved separately for every prediction.
  gripper_max_correction_m: 0.03
  # Provider-side temporal ensemble aligned to absolute simulation time.
  # Positive values retain older predictions; unset/None keeps it disabled.
  temporal_ensemble_coeff: 0.01

service:
  bind_address: 0.0.0.0
  port: 50051
  max_workers: 4
  max_message_bytes: 16777216
  max_sessions: 8
  max_open_requests: 128
  max_request_cache: 128
  # 60 x 50 ms targets span 50 ms .. 3000 ms.  The RPC deadline is bounded but
  # does not claim the model can be interrupted mid-kernel.
  predict_deadline_s: 3.0
  open_deadline_s: 5.0
  close_deadline_s: 5.0
  test_only: false
  protocol_major: 1
  stateful: true
  task_id: panda-stack
  task_text: Pick up the red source cube and place it on the blue target cube.

logging:
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
