# 中文参数说明（维护时优先阅读本段）
# schema_version：配置格式版本，当前必须为 1。
# robot_profile：机器人关节、相机和硬件范围定义文件。
# observation_schema：策略观测字段与顺序定义文件。
# action_schema：策略动作字段、单位与顺序定义文件。
# control_constraints：执行器加速度、位置/速度容差和接触阈值。
# follower_constraints：动作块跟随窗口与目标偏差预算。
# robot_namespace：ROS 话题、服务和参数使用的命名空间。
# action_source：动作来源，可选 policy、teacher 或 diagnostic_motion。
# lease_duration_ns：控制租约有效期，单位 ns。
# renew_interval_ns：租约续期周期，单位 ns。
# command_acceptance_ns：命令接受时间窗口，单位 ns。
# startup_timeout_s：等待后端 ready 的超时，单位 s。
# call_timeout_s：普通 ROS 服务调用超时，单位 s。
# command_timeout_s：命令提交、查询和终态等待超时，单位 s。
# reset.enabled：每局开始前是否复位机器人/仿真环境。
# reset.seed：复位种子；相同种子生成相同初始布局。
# observation.reliable：是否使用可靠 QoS 接收观测。
# observation.max_skew_ns：状态与三路图像允许的最大时间偏差，单位 ns。
# observation.max_age_ns：完整观测允许的最大年龄，单位 ns。
# observation.wall_arrival_timeout_s：等待完整观测的墙钟超时，单位 s。
# observation.capacity：观测缓存容量。
# control.submit_query_retries：提交结果未知时按 command_id 查询的重试次数。
# control.poll_interval_s：命令状态查询轮询间隔，单位 s。
# control.stop_timeout_s：停止动作等待超时，单位 s。
# control.terminal_timeout_s：等待命令进入终态的超时，单位 s。
# teacher.chunk_size：教师返回的动作点数。
# teacher.action_period_ns：动作点间隔，单位 ns。
# teacher.target_count：每次执行的教师动作点数。
# teacher.initial_lead_ns：首块提前量，单位 ns。
# teacher.max_chunks：单局最多动作块数。
# teacher.total_sim_deadline_ns：单局仿真时限，单位 ns。
# teacher.total_wall_deadline_s：单局墙钟时限，单位 s。
# teacher.prepare_timeout_s：教师任务准备超时，单位 s。
# teacher.start_timeout_s：教师任务启动超时，单位 s。
# teacher.chunk_deadline_s：单次教师动作块请求超时，单位 s。
# teacher.poll_interval_s：教师状态轮询间隔，单位 s。
# teacher.termination_mode：终止模式，当前为 task。
# teacher.task_stop_margin_s：任务截止前停车余量，单位 s。
# teacher.task_sim_budget_ns：任务阶段仿真预算，单位 ns。
# motions：诊断动作列表；policy/teacher 运行通常为空。
# logging.queue_capacity：事件日志内存队列容量。
# logging.max_event_bytes：单条日志最大字节数。
# logging.max_file_bytes：单个日志文件最大字节数。
# logging.max_total_bytes：单个运行日志总大小上限。
# logging.close_timeout_s：关闭日志的等待超时，单位 s。
# logging.flush_interval_s：日志刷新间隔，单位 s。
# logging.console：是否同时输出到控制台；容器运行通常为 false。
# recording.queue_capacity：MCAP 录制写入队列容量。
# recording.max_pending_bytes：录制待写数据最大字节数。
# recording.startup_timeout_s：录像启动超时，单位 s。
# recording.close_timeout_s：录像关闭超时，单位 s。

# Program-teacher runtime for the independent stack task.
# The action source is the 033 ROS teacher service, never a policy endpoint.
# Teacher chunks and the policy stream share one bounded-follower executor,
# the same 60x16/50 ms/5-point execution window and the same ACK/anchor path.
schema_version: 1
robot_profile: ../../../profiles/robots/panda_stack_learning_v1/profile.json
observation_schema: ../../../profiles/observations/panda_rgb_joint_v1.json
action_schema: ../../../profiles/actions/panda_joint_position_v1.json
control_constraints: ../../../simulation/mujoco/configs/control/panda_control.yaml
follower_constraints: ../../../simulation/mujoco/configs/control/panda_follower.yaml
robot_namespace: /robot

action_source: teacher

lease_duration_ns: 2000000000
renew_interval_ns: 500000000
command_acceptance_ns: 500000000
startup_timeout_s: 30.0
call_timeout_s: 5.0
command_timeout_s: 8.0

reset:
  enabled: true
  seed: 0

observation:
  reliable: true
  max_skew_ns: 0
  max_age_ns: 500000000
  wall_arrival_timeout_s: 1.5
  capacity: 32

control:
  submit_query_retries: 2
  poll_interval_s: 0.02
  stop_timeout_s: 8.0
  terminal_timeout_s: 20.0

# A 30 s task at 0.25 s per executed five-point window needs at least 120
# chunks.  256 is the hard bound; only the actually executed windows become
# labels, never the full 60-point raw prediction.
teacher:
  chunk_size: 60
  action_period_ns: 50000000
  target_count: 5
  initial_lead_ns: 250000000
  max_chunks: 256
  total_sim_deadline_ns: 30000000000
  total_wall_deadline_s: 60.0
  prepare_timeout_s: 12.0
  start_timeout_s: 5.0
  chunk_deadline_s: 2.0
  poll_interval_s: 0.02
  termination_mode: task
  # Stop 1 s before the 30 s judge deadline: the 0.2 s measured stable window
  # plus bounded braking at the configured max velocity/acceleration.
  task_stop_margin_s: 1.0
  task_sim_budget_ns: 30000000000

motions: []

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
recording:
  queue_capacity: 1024
  max_pending_bytes: 67108864
  startup_timeout_s: 5.0
  close_timeout_s: 5.0
