# 中文参数说明（维护时优先阅读本段）
# schema_version：配置格式版本，当前必须为 1。
# robot_profile：机器人关节、相机和硬件范围定义文件。
# observation_schema：策略观测字段与顺序定义文件。
# action_schema：策略动作字段、单位与顺序定义文件。
# control_constraints：执行器加速度、位置/速度容差和接触阈值。
# follower_constraints：动作块跟随窗口与目标偏差预算。
# robot_namespace：ROS 话题、服务和参数使用的命名空间。
# action_source：动作来源，可选 policy、teacher 或 diagnostic_motion。
# lease_duration_ns：控制租约有效期，单位 ns。
# renew_interval_ns：租约续期周期，单位 ns。
# command_acceptance_ns：命令接受时间窗口，单位 ns。
# startup_timeout_s：等待后端 ready 的超时，单位 s。
# call_timeout_s：普通 ROS 服务调用超时，单位 s。
# command_timeout_s：命令提交、查询和终态等待超时，单位 s。
# reset.enabled：每局开始前是否复位机器人/仿真环境。
# reset.seed：复位种子；相同种子生成相同初始布局。
# observation.reliable：是否使用可靠 QoS 接收观测。
# observation.max_skew_ns：状态与三路图像允许的最大时间偏差，单位 ns。
# observation.max_age_ns：完整观测允许的最大年龄，单位 ns。
# observation.wall_arrival_timeout_s：等待完整观测的墙钟超时，单位 s。
# observation.capacity：观测缓存容量。
# control.submit_query_retries：提交结果未知时按 command_id 查询的重试次数。
# control.poll_interval_s：命令状态查询轮询间隔，单位 s。
# control.stop_timeout_s：停止动作等待超时，单位 s。
# control.terminal_timeout_s：等待命令进入终态的超时，单位 s。

# script_targets：mock 采集模式下依次执行的演示动作。
# script_targets[].duration_ns：该段动作时长，单位 ns。
# script_targets[].positions：动作结束时各关节目标位置。
# logging.*、recording.*：同下方公共说明。

schema_version: 1
robot_profile: profiles/robots/mock_dual_arm_v1/profile.json
observation_schema: profiles/observations/mock_rgb_joint_v1.json
action_schema: profiles/actions/mock_joint_position_v1.json
robot_namespace: /cell_01/robot
lease_duration_ns: 2000000000
renew_interval_ns: 500000000
startup_timeout_s: 20.0
call_timeout_s: 3.0
command_timeout_s: 5.0
command_acceptance_ns: 500000000
logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
recording:
  queue_capacity: 1024
  max_pending_bytes: 67108864
  startup_timeout_s: 5.0
  close_timeout_s: 5.0
script_targets:
  - duration_ns: 800000000
    positions: [0.2, -0.2, 0.15, -0.15, 0.02, 0.02]
  - duration_ns: 800000000
    positions: [-0.2, 0.2, -0.15, 0.15, 0.06, 0.06]
  - duration_ns: 800000000
    positions: [0.0, 0.0, 0.0, 0.0, 0.04, 0.04]
