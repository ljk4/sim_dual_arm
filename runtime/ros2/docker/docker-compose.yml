# ROS 2 运行端：源码只读，构建与数据目录可写。
name: sim-dual-arm

services:
  runtime:
    image: sim-dual-arm/runtime:current
    build: .
    user: "1000:1000"
    working_dir: /workspace
    init: true
    restart: "no"
    stop_grace_period: 20s
    pull_policy: never
    env_file: ../configs/container.env
    volumes:
      - ../../../:/workspace:ro
      - ../../../shared:/shared:ro
      - ../../../var:/workspace/var
      - ../../../build:/workspace/build
      - ../../../build:/build
      - ../../../var:/data
    networks: [ros, learning]

networks:
  ros: {}
  learning: {}
