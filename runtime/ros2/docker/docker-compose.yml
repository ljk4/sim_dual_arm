# ROS 2 运行端：源码只读，构建与数据目录可写。
name: sim-dual-arm

services:
  runtime:
    image: sim-dual-arm/runtime:current
    build: .
    container_name: sim-dual-arm-runtime
    network_mode: host
    user: "1000:1000"
    working_dir: /app
    init: true
    restart: "no"
    stop_grace_period: 20s
    pull_policy: never
    env_file: ../configs/container.env
    volumes:
      - ../:/app:ro
      - ../../../shared:/shared:ro
      - ../../../output/build:/build
      - ../../../output:/data
      - ../../../shared/common/tools/docker/container_bashrc.sh:/etc/bash.bashrc:ro
