# Bounded stack-collection campaign.
#
# Seeds are allocated in order and every full rollout needs a ledger record
# BEFORE the runtime is started.  RESERVED/RUNNING attempts count even if the
# process crashes; the ledger is append-only and never reset by this tool.
schema_version: 1

budget:
  # DSH-034 pilot: at most ten complete attempts.  Seeds 1000..1007 cover
  # teacher rollouts and label replays; 1008..1009 are reserved for ACT smoke
  # inference.  Label replay consumes a pilot attempt and never starts an
  # unaccounted rollout.
  pilot_seed_first: 1000
  pilot_seed_last: 1009
  pilot_max_attempts: 10
  pilot_act_reserved_attempts: 2
  pilot_teacher_seed_last: 1007
  pilot_label_replay_max: 2

  formal_seed_first: 10000
  formal_seed_last: 10099
  formal_max_attempts: 100
  formal_target_qualified: 50
  # Zero-based positions in the qualified list: 10th, 20th, 30th, 40th, 50th.
  formal_validation_qualified_indices: [9, 19, 29, 39, 49]

  test_seed_first: 20000
  test_seed_last: 20019
  test_max_attempts: 20
  # Explicit ACT evaluation purpose; shares the fixed test seeds and total cap
  # with `test`, so a seed can never be consumed twice.
  evaluation_max_attempts: 20

  # 30 GiB including failed attempts and every raw byte under the attempt root.
  max_raw_bytes: 32212254720
  # Reserve room for the final manifest/task sidecars and disk headroom.
  reserve_bytes: 2147483648
  # Conservative single-attempt estimate; measured bytes replace it on finish.
  estimated_attempt_bytes: 268435456
  min_free_bytes: 5368709120

paths:
  attempts_root: var/campaigns/panda_stack_v1/attempts
  ledger: var/campaigns/panda_stack_v1/attempts.jsonl
  lock: var/campaigns/panda_stack_v1/.ledger.lock
  run_lock: var/campaigns/panda_stack_v1/.run.lock
  # Created/checked before a reservation; all must exist.
  required_paths:
    - configs/runtime/native_teacher.yaml
    - configs/runtime/native_task_act.yaml
    - configs/learning/act_policy.yaml
    - deploy/compose/native_act_policy.yaml
    - configs/simulation/backend_stack_teacher.yaml
    - configs/simulation/panda_stack_task.yaml
    - contracts/ros/robot_api_msgs/srv/GetTeacherChunk.srv
  sdk_marker: .build/ros-dev/contracts.json

launch:
  # The supervisor supplies the actual ROS/container command.  Placeholders:
  # {seed} {run_id} {episode_id} {attempt_dir} {config} {project_python}
  command: []
  # Best-effort cleanup after timeout/signal; must stop only this attempt's
  # compose project/process group.
  cleanup_command: []
  timeout_s: 180.0

quality:
  # A rollout is not qualified unless the exported quality sidecar says true.
  # Rules mirror the accepted kinematics_check.visibility thresholds and modes:
  # required gates qualification, record_only is reported and never gates.
  sidecar: quality.json
  max_blackout_s: 0.35
  min_qualified_ratio: 0.85
  rules:
    - camera: right_wrist
      object: source
      phases: [pregrasp, grasp, close, lift]
      mode: required
      min_pixels: 64
    - camera: right_wrist
      object: source
      phases: [transport, lower, open, retreat, stable]
      mode: record_only
      min_pixels: 64
    - camera: right_wrist
      object: target
      phases: [pregrasp, grasp, close, lift]
      mode: record_only
      min_pixels: 64
    - camera: right_wrist
      object: target
      phases: [transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 64
    - camera: global
      object: target
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 64
    - camera: global
      object: source
      phases: [pregrasp, lift, transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 32
    - camera: global
      object: source
      phases: [grasp, close]
      mode: record_only
      min_pixels: 32
    - camera: left_wrist
      object: table
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: required
      min_pixels: 4096
    - camera: left_wrist
      object: source
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: record_only
      min_pixels: 64
    - camera: left_wrist
      object: target
      phases: [pregrasp, grasp, close, lift, transport, lower, open, retreat, stable]
      mode: record_only
      min_pixels: 64
