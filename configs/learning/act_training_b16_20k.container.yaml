# DSH-041: fresh batch_size=16 / 20000-step full ACT run.
#
# The model, seed, optimizer, LR, AMP and 45/5 split are the accepted full
# recipe from var/learning/configs/full.yaml; only the batch size, step budget,
# path binding and the optional DSH-040 query-anchor sample filter differ.
# This run starts from scratch and must not resume the old 5000-step run.
schema_version: 1
mode: full
seed: 20261102
device: cuda
cache_root: /output/cache/hf
data:
  config: /workspace/configs/learning/act_dataset.yaml
  root: /learning-data
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
  sample_filter: /training-filter.json
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  # None is intentional: the local official file is loaded explicitly and
  # strictly, so model construction can never trigger an implicit download.
  pretrained_backbone_weights: null
  weights:
    path: /learning-cache/hub/checkpoints/resnet18-f37072fd.pth
    sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec
training:
  batch_size: 16
  # Overlap RGB decoding with GPU training; verified by the workers2 preflight.
  num_workers: 2
  lr: 1.0e-05
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  # Validate and save every 1000 steps, plus the final-step save.
  val_every_steps: 1000
  save_every_steps: 1000
  # 512 batches of 16 covers the complete 5-episode / 2160-frame validation
  # split (135 batches are needed; the cap is deliberately not lowered).
  val_batches: 512
  dtype: float32
  amp: false
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    episodes: [0, 1]
    validation: false
    reserve_seconds: 900.0
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
    reserve_seconds: 1800.0
  full:
    steps: 20000
    split: train
    episodes: all
    validation: true
    # Shared ledger has about 12283 s remaining; reserving 12000 s keeps the
    # preflight plus this run below the unchanged 14400 s task limit.
    reserve_seconds: 12000.0
budget:
  limit_seconds: 14400.0
  # /output is the shared var/learning directory, so old consumed time stays
  # in this append-only ledger. It is never truncated or replaced.
  ledger: /output/training-budget.jsonl
  lock: /output/.training-budget.lock
  stop_margin_seconds: 30.0
  min_free_bytes: 2147483648
checkpoint:
  # A new run root; the old 5000-step runs and bundles are not overwritten.
  root: /output/experiments/act-static-b16-20k-20261103/runs
  keep_latest: true
  keep_best: true
  keep_final: true
  min_free_bytes: 2147483648
  save_before_exit: true
logging:
  root: /output/experiments/act-static-b16-20k-20261103/runs
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
