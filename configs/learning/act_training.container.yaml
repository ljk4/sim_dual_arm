# DSH-035 first short round: smoke -> single-episode overfit -> 45/5 full.
# The 5000-step full mode still uses all 45 train and all 5 validation episodes.
schema_version: 1
mode: smoke
seed: 20261102
device: cuda
cache_root: /output/cache
data:
  config: /workspace/configs/learning/act_dataset.container.yaml
  root: /data
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  # None is intentional: the local official file is loaded explicitly and
  # strictly, so model construction can never trigger an implicit download.
  pretrained_backbone_weights: null
  weights:
    path: /opt/learning-cache/torch/hub/checkpoints/resnet18-f37072fd.pth
    sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec
training:
  batch_size: 8
  num_workers: 0
  lr: 0.00001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  val_every_steps: 1000
  save_every_steps: 1000
  # Covers all five full validation episodes (not only episode 0).
  val_batches: 512
  dtype: float32
  amp: false
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    episodes: [0, 1]
    validation: false
    reserve_seconds: 900.0
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
    reserve_seconds: 1800.0
  full:
    steps: 5000
    split: train
    episodes: all
    validation: true
    reserve_seconds: 7200.0
budget:
  limit_seconds: 14400.0
  ledger: /output/training-budget.jsonl
  lock: /output/.training-budget.lock
  stop_margin_seconds: 30.0
  min_free_bytes: 2147483648
checkpoint:
  root: /output/runs
  keep_latest: true
  keep_best: true
  keep_final: true
  min_free_bytes: 2147483648
  save_before_exit: true
logging:
  root: /output/runs
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
