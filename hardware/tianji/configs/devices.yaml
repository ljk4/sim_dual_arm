# TianJi deployment: APEX dual arms, CTAG2F90-C grippers, RGB3 + tactile4.
arms:
  host: 172.16.100.2
  left_arm: arm_left
  right_arm: arm_right
  enable_on_start: false
  command_vel: 0.3
  connect_timeout_s: 10.0
  poll_hz: 120.0
  auto_clear_fault: true
  max_joint_step_deg: 1.0
  tracking_arm_retry_interval_s: 1.0
  tracking_arm_max_failures: 3
  tracking_settle_timeout_s: 3.0
grippers:
  left:
    port: /dev/gripper_left
    usb_port: 8-1.1
    slave_id: 1
    baudrate: 115200
    max_stroke_mm: 90.0
    invert_stroke: true
  right:
    port: /dev/gripper_right
    usb_port: 1-3.3
    slave_id: 1
    baudrate: 115200
    max_stroke_mm: 90.0
    invert_stroke: true
cameras:
- name: cam_high
  backend: realsense
  serial_number: '254522075303'
  width: 640
  height: 480
  fps: 30
  enable_depth: false
- name: cam_left_wrist
  backend: realsense
  serial_number: '260322278061'
  width: 640
  height: 480
  fps: 30
  enable_depth: false
- name: cam_right_wrist
  backend: realsense
  serial_number: '260522272531'
  width: 640
  height: 480
  fps: 30
  enable_depth: false
- name: tactile_right_right
  backend: ffmpeg_v4l2
  device: /dev/v4l/by-path/pci-0000:09:00.0-usb-0:3.2:1.0-video-index0
  width: 640
  height: 480
  fps: 30
  auto_exposure: true
  intrinsics: null
- name: tactile_right_left
  backend: ffmpeg_v4l2
  device: /dev/v4l/by-path/pci-0000:09:00.0-usb-0:3.1:1.0-video-index0
  width: 640
  height: 480
  fps: 30
  auto_exposure: true
  intrinsics: null
- name: tactile_left_left
  backend: ffmpeg_v4l2
  device: /dev/v4l/by-path/pci-0000:09:00.0-usb-0:4.4:1.0-video-index0
  width: 640
  height: 480
  fps: 30
  auto_exposure: true
  intrinsics: null
- name: tactile_left_right
  backend: ffmpeg_v4l2
  device: /dev/v4l/by-path/pci-0000:09:00.0-usb-0:4.3:1.0-video-index0
  width: 640
  height: 480
  fps: 30
  auto_exposure: true
  intrinsics: null
