# 中文参数说明（维护时优先阅读本段）
# schema_version：训练配置版本。
# mode：默认训练模式；命令行 --mode 可覆盖。
# seed：训练随机种子。
# device：训练设备，cuda 或 cpu。
# cache_root：模型/数据集缓存目录。
# data.config：数据集转换配置路径。
# data.root/manifest/train_dir/validation_dir：数据集根、清单和训练/验证子目录。
# data.verify_hashes：是否启动前校验数据集文件哈希。
# model.*：视觉骨干、Transformer 维度/层数、VAE、dropout、KL 权重和预训练权重；权重哈希由运行时计算。
# training.*：batch、worker、锁页内存、预取、混合精度、学习率、权重衰减、梯度裁剪、日志/验证/保存间隔、验证 batch 和确定性。
# modes.*：smoke/overfit/full 的步数、数据划分、episode 范围、是否验证及预算预留时间。
# budget.*：总训练预算、追加式台账、锁文件、停止余量和最小磁盘空间。
# checkpoint.*：检查点根目录、保留策略和最小磁盘空间。
# logging.*：训练事件日志容量、文件大小和刷新设置。

# DSH-035 first short round: smoke -> single-episode overfit -> 45/5 full.
# The 5000-step full mode still uses all 45 train and all 5 validation episodes.
schema_version: 1
mode: smoke
seed: 20261102
device: cuda
cache_root: .build/cache/huggingface-learning
data:
  config: learning/lerobot/configs/act_dataset.yaml
  root: var/learning/panda_stack_learning_v1
  manifest: manifest.json
  train_dir: train
  validation_dir: validation
  verify_hashes: true
model:
  vision_backbone: resnet18
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 4
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  # None is intentional: the local official file is loaded explicitly and
  # strictly, so model construction can never trigger an implicit download.
  pretrained_backbone_weights: null
  weights:
    path: .build/cache/torch/hub/checkpoints/resnet18-f37072fd.pth
training:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  use_amp: true
  amp_dtype: bfloat16
  lr: 0.00001
  weight_decay: 0.0001
  grad_clip_norm: 10.0
  log_every_steps: 10
  val_every_steps: 1000
  save_every_steps: 1000
  # Covers all five full validation episodes (not only episode 0).
  val_batches: 512
  deterministic: true
modes:
  smoke:
    steps: 128
    split: train
    episodes: [0, 1]
    validation: false
    reserve_seconds: 900.0
  overfit:
    steps: 500
    split: train
    episodes: [0]
    validation: false
    reserve_seconds: 1800.0
  full:
    steps: 5000
    split: train
    episodes: all
    validation: true
    reserve_seconds: 7200.0
budget:
  limit_seconds: 14400.0
  ledger: var/learning/training-budget.jsonl
  lock: var/learning/.training-budget.lock
  stop_margin_seconds: 30.0
  min_free_bytes: 2147483648
checkpoint:
  root: var/learning/runs
  keep_latest: true
  keep_best: true
  keep_final: true
  min_free_bytes: 2147483648
  save_before_exit: true
logging:
  root: var/learning/runs
  component: act-training
  queue_capacity: 1024
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 67108864
  close_timeout_s: 5.0
  flush_interval_s: 0.2
  console: false
