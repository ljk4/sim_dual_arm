# DSH-040: down-sample only redundant static *training query anchors*.
# This is not a physical success test and never rewrites source rows/videos.
schema_version: 1
fps: 20
chunk_size: 60
right_arm:
  # The seven right arm rad axes; the idle left arm is deliberately excluded.
  joint_indices: [8, 9, 10, 11, 12, 13, 14]
  max_step_rad: 0.001
  max_velocity_rad_s: 0.01
grippers:
  # Both gripper widths are in metres and remain independent of the rad axes.
  joint_indices: [7, 15]
  max_step_m: 0.0005
  max_velocity_m_s: 0.002
static_runs:
  min_frames: 15
  edge_frames: 5
  interior_stride: 5
  phase_boundary_frames: 5
  episode_boundary_frames: 5
  min_episode_kept_frames: 60
  reason: redundant_static_anchor
phase_gate:
  known_phases:
    - pregrasp
    - grasp
    - close
    - lift
    - transport
    - lower
    - open
    - retreat
    - stable
  tracking_gate: TRACKING
