# 中文参数说明（维护时优先阅读本段）
# schema_version：服务配置版本。
# bind_address/port：gRPC 监听地址和端口。
# max_workers：gRPC 工作线程数。
# max_message_bytes：单条消息大小上限。
# max_sessions/max_open_requests/max_request_cache：会话和请求缓存上限。
# predict_deadline_s/open_deadline_s/close_deadline_s：各 RPC 超时，单位 s。
# test_only：是否只允许测试使用。
# protocol_major：Policy 协议主版本。
# stateful：是否为有状态会话。
# model_bundle_digest/processor_digest：模型与处理器摘要。
# observation_schema_hash/action_schema_hash/robot_profile_hash：接口语义摘要。
# joint_names/joint_lower_bounds/joint_upper_bounds：16 轴顺序和范围。
# action_joint_names：动作轴顺序。
# camera_names/camera_width/camera_height：相机输入定义。
# action_period_ns：动作周期，单位 ns。
# chunk_size：动作块长度。
# task_id/task_text：诊断任务身份。
# command_space：动作空间，当前为关节位置。

# Real gRPC Policy service for the diagnostic S3 loop.  The fake provider is
# test_only; a future ACT provider may reuse this configuration shape with
# test_only: false.  All units are SI and times are integer nanoseconds.
