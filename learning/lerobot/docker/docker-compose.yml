# ACT 学习端：ROS-free，使用 GPU 与可写输出目录。
name: sim-dual-arm

services:
  lerobot:
    image: sim-dual-arm/lerobot:current
    build: .
    container_name: sim-dual-arm-lerobot
    network_mode: host
    user: "1000:1000"
    working_dir: /app
    init: true
    restart: "no"
    stop_grace_period: 30s
    pull_policy: never
    runtime: nvidia
    gpus: all
    shm_size: 1gb
    env_file: ../configs/container.env
    volumes:
      - ../:/app:ro
      - ../../../shared:/shared:ro
      - ../../../output/build/generated/policy-sdk:/opt/policy-sdk:ro
      - ../../../output:/data
      - ../../../output/build:/data/build:ro
      - ../../../third_party:/third_party:ro
      - ../../../shared/common/tools/docker/container_bashrc.sh:/etc/bash.bashrc:ro
