# ACT 学习端：ROS-free，使用 GPU 与可写输出目录。
name: sim-dual-arm

services:
  learning:
    image: sim-dual-arm/learning:current
    build: .
    container_name: sim-dual-arm-learning
    hostname: learning
    user: "1000:1000"
    working_dir: /app
    init: true
    restart: "no"
    stop_grace_period: 30s
    pull_policy: never
    runtime: nvidia
    gpus: all
    shm_size: 1gb
    env_file: ../configs/container.env
    volumes:
      - ../:/app:ro
      - ../../../shared:/shared:ro
      - ../../../build/generated/policy-sdk:/opt/policy-sdk:ro
      - ../../../var:/data
      - ../../../third_party:/third_party:ro
      - ../../../shared/common/tools/docker/container_bashrc.sh:/etc/bash.bashrc:ro
    networks: [learning]

networks:
  learning: {}
