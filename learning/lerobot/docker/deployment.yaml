# Deployment requirements checked by shared/common/tools/scripts/check_dockerfiles.py.
# Mount sources, build settings and environment stay in docker-compose.yml and container.env.
service: learning
source:
  mount: /app
  scope: implementation
mounts:
  /opt/policy-sdk: read-only
  /data: writable
  /etc/bash.bashrc: read-only
  /third_party: read-only
networks: [learning]
gpu: true
commands: [convert, train, server_policy, test]
