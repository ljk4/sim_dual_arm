# 中文参数说明（维护时优先阅读本段）
# service.bind_address/port：gRPC 监听地址和端口。
# service.max_workers：gRPC 工作线程数。
# service.max_message_bytes：单条消息大小上限。
# service.max_sessions/max_open_requests/max_request_cache：会话和请求缓存上限。
# service.predict_deadline_s/open_deadline_s/close_deadline_s：各 RPC 超时，单位 s。
# service.test_only：是否只允许测试使用。
# service.model_bundle_digest/processor_digest：测试用固定摘要。
# service.observation_schema_hash/action_schema_hash/robot_profile_hash：接口语义摘要。
# service.joint_names/joint_lower_bounds/joint_upper_bounds：16 轴顺序和范围。
# service.action_joint_names：动作轴顺序。
# service.camera_names/camera_width/camera_height：三路相机名称与尺寸。
# service.action_period_ns：动作周期，单位 ns。
# service.chunk_size：动作块长度。
# service.task_id/task_text：诊断任务身份。
# service.command_space：动作空间，当前为关节位置。
# fake.amplitude_rad/amplitude_m：测试正弦动作幅值。
# fake.latency_s：模拟推理延迟，单位 s。
# fake.fault：注入故障类型，none 表示不注入。
# fake.stop_after_predictions：预测多少次后停止，0 表示不限制。

# Fake Policy RPC service used only by the diagnostic runtime and tests.
# It injects the typed test provider into the production service layer; it is
# not a training/evaluation data source and never claims task success.
service:
  bind_address: 127.0.0.1
  port: 50051
  max_workers: 8
  max_message_bytes: 16777216
  max_sessions: 8
  max_open_requests: 128
  max_request_cache: 128
  predict_deadline_s: 2.0
  open_deadline_s: 2.0
  close_deadline_s: 2.0
  test_only: true
  model_bundle_digest: 9f2c67c0c4b0a4f6f5a0d9b6c1f8f0c5c4f3e2d1a0b9c8d7e6f5a4b3c2d1e0f9
  processor_digest: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
  observation_schema_hash: 2e6a0da228b94e75eaf3bd9206589402abdd677ef3ce30bfe9d0572f24b5b678
  action_schema_hash: d2509712bf248f859b8298d622bb1a9e7e9e28f42180ae22425f120faf41fe54
  robot_profile_hash: 38c00b01d12b1d425c076df9e4c89ca1433dfa875e489d3f2e504e8f208e0dfb
  joint_names: [left_joint1, left_joint2, left_joint3, left_joint4, left_joint5, left_joint6, left_joint7, left_gripper_width, right_joint1, right_joint2, right_joint3, right_joint4, right_joint5, right_joint6, right_joint7, right_gripper_width]
  joint_lower_bounds: [-3.1067, -2.0944, -3.1067, -2.5307, -3.1067, -1.0472, -1.5708, 0.0014, -3.1067, -2.0944, -3.1067, -2.5307, -3.1067, -1.0472, -1.5708, 0.0014]
  joint_upper_bounds: [3.1067, 2.0944, 3.1067, 1.0472, 3.1067, 1.0472, 1.5708, 0.0814, 3.1067, 2.0944, 3.1067, 1.0472, 3.1067, 1.0472, 1.5708, 0.0814]
  action_joint_names: [left_joint1, left_joint2, left_joint3, left_joint4, left_joint5, left_joint6, left_joint7, left_gripper_width, right_joint1, right_joint2, right_joint3, right_joint4, right_joint5, right_joint6, right_joint7, right_gripper_width]
  camera_names: [global, left_wrist, right_wrist]
  camera_width: 320
  camera_height: 240
  action_period_ns: 50000000
  chunk_size: 60
  task_id: diagnostic-policy-stream
  task_text: Follow the observed three-camera dual-arm state with small bounded joint motion.
  command_space: joint_position

fake:
  # A finite, explainable small sinusoid around the measured positions.
  amplitude_rad: 0.01
  amplitude_m: 0.001
  latency_s: 0.01
  fault: none
  stop_after_predictions: 0
