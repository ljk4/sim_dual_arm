# Runnable native ROS backend.  This file owns deployment choices only; the
# referenced scene/control/stream/profile files remain the single sources of
# physics, controller and calibration parameters.  Every path is relative to
# this file.  SI time units are seconds unless a field says otherwise.
robot:
  namespace: /robot
  profile: ../../../../profiles/robots/panda_stack_v1/profile.json
  schemas: ../../../../contracts/schemas
  scene: ../scene/panda_stack.yaml
  control: ../control/panda_control.yaml
  stream: ../control/panda_stream.yaml

run:
  seed: 0
  # Complete-scene captures per second.  Physics still runs at the scene's
  # timestep; this only selects how often an immutable snapshot is copied.
  capture_hz: 20.0
  # 1.0 is real time.  Values above 1 speed up wall pacing without changing
  # the simulation timestep or skipping physical steps.
  realtime_speed: 1.0
  # Bound one owner cycle's catch-up burst; excess wall lateness is dropped.
  max_catchup_steps: 8

queues:
  owner: 64
  planner: 4
  render_snapshots: 4
  render_outputs: 8
  captures: 32
  events: 256
  feedback: 64
  accepted_references: 64

limits:
  planner_health_s: 10.0
  renderer_health_s: 5.0
  request_timeout_s: 5.0
  shutdown_s: 10.0

logging:
  queue_capacity: 256
  max_event_bytes: 32768
  max_file_bytes: 8388608
  max_total_bytes: 268435456
  close_timeout_s: 3.0
  flush_interval_s: 0.2
  console: false
