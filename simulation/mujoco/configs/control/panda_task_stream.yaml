# Continuous native chunk-stream parameters.  SI units only: seconds.
# Loaded separately from panda_control.yaml so the accepted per-motion file
# does not gain new required keys.  All values convert to positive integer ns.
initial_lead_s: 0.25
min_lead_s: 0.05
max_observation_age_s: 0.5
stream_wall_timeout_s: 120.0
progress_wall_timeout_s: 3.0
tracking_timeout_s: 2.0

# Task-only, user-approved contact release transition. No reference is changed.
# Requires prior qualified two-finger same-object contact and current evidence;
# expires at 2 s, or once the opening reference catches the measured aperture.
contact_unload_timeout_s: 2.0
