# MuJoCo 仿真端：源码与 SDK 只读，数据输出可写。
name: sim-dual-arm

services:
  simulation:
    image: sim-dual-arm/simulation:current
    build: .
    container_name: sim-dual-arm-simulation
    network_mode: host
    user: "1000:1000"
    working_dir: /app
    init: true
    restart: "no"
    stop_grace_period: 10s
    pull_policy: never
    runtime: nvidia
    gpus: all
    env_file: ../configs/container.env
    volumes:
      - ../:/app:ro
      - ../../../shared:/shared:ro
      - ../../../var:/data
      - ../../../build/ros-dev:/opt/ros-dev:ro
      - ../../../shared/common/tools/docker/container_bashrc.sh:/etc/bash.bashrc:ro
